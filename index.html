<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR (MindAR) + Demo 3D — Ajuste de Pivote</title>

  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>

  <style>
    :root { --bg:#0b0f13; --chip:#ffffff18; }
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
    #screen{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--bg);color:#fff;padding:20px;text-align:center}
    .btn{padding:12px 16px;border-radius:12px;border:1px solid #ffffff26;background:var(--chip);color:#fff;font-weight:600;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    #log{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;color:#0ff;background:#001014cc;padding:8px 10px;border-radius:10px;font:12px/1.3 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:34vh;overflow:auto}
    #demoWrap{position:fixed;inset:0;background:#fff;display:none}
    a-scene{position:fixed;inset:0}
    .hint{opacity:.8;font-size:12px}
  </style>
</head>
<body>
  <div id="screen">
    <div style="font-size:18px;opacity:.9">Prototipo: MindAR + Demo 3D</div>
    <div class="row">
      <button class="btn" id="btnAR">🚀 Iniciar AR (marcador)</button>
      <button class="btn" id="btnDemo">🎮 Demo 3D (sin AR)</button>
    </div>
    <div class="hint">Arrastra para rotar y usa pinza/rueda para zoom.</div>
  </div>

  <div id="demoWrap"></div>
  <div id="log"></div>

  <script>
    // ---------- UTILIDADES ----------
    const logEl = document.getElementById('log');
    const log = m => { console.log(m); logEl.textContent += (logEl.textContent?'\n':'') + m; logEl.scrollTop = logEl.scrollHeight; };
    const isSecure = location.protocol.startsWith('https') || location.hostname === 'localhost';
    if(!isSecure) log('⚠️ Requiere HTTPS para la cámara.');
    if(!window.AFRAME) log('❌ A-Frame NO cargó.');
    const clamp = (v,min,max) => Math.min(max, Math.max(min, v));

    // ===== MODO DEMO 3D (SIN AR) =====
    function startDemo(){
      document.getElementById('screen').style.display = 'none';
      const wrap = document.getElementById('demoWrap');
      wrap.style.display = 'block';

      wrap.innerHTML = `
        <a-scene id="demoScene" background="color: #ffffff" renderer="colorManagement:true; antialias:true" vr-mode-ui="enabled:false">
          <a-assets timeout="30000"><a-asset-item id="covidModel" src="./covid.glb"></a-asset-item></a-assets>
          <a-entity light="type: ambient; intensity: 1.0"></a-entity>
          <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

          <a-entity id="rotator" rotation="0 0 0">
            <a-entity id="model-wrapper" position="0 0 0">
              <a-gltf-model id="model3d" src="#covidModel" scale="1 1 1" position="0 0 0"></a-gltf-model>
            </a-entity>
          </a-entity>

          <a-entity id="cameraRig" position="0 0 0">
             <a-camera id="camera" look-controls="enabled:false"></a-camera>
          </a-entity>
        </a-scene>
      `;

      const scene = document.getElementById('demoScene');
      scene.addEventListener('loaded', () => {
        const rotator = document.getElementById('rotator');
        const cameraRig = document.getElementById('cameraRig');
        const canvas = scene.renderer.domElement;
        
        // ** AJUSTE MANUAL DEL PIVOTE **
        // Cuando el modelo cargue, calculamos su centro y ajustamos el wrapper.
        const modelEl = document.getElementById('model3d');
        modelEl.addEventListener('model-loaded', () => {
            const obj = modelEl.getObject3D('mesh');
            if(!obj) return;
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            
            // Movemos el modelo en la dirección OPUESTA a su centro.
            // Esto efectivamente mueve el centro del modelo al origen del 'rotator'.
            const wrapper = document.getElementById('model-wrapper');
            wrapper.setAttribute('position', { x: -center.x, y: -center.y, z: -center.z });
            log(`✅ Pivote del modelo ajustado por: X:${-center.x.toFixed(2)}, Y:${-center.y.toFixed(2)}, Z:${-center.z.toFixed(2)}`);
        });

        // Lógica de interacción (rotación y zoom) - Sin cambios
        const st = { dragging: false, lastX: 0, lastY: 0, yaw: 0, pitch: 0, velX: 0, velY: 0, dist: 1.5, min: 0.5, max: 4.0 };
        (function tick(){
          if (!st.dragging) { st.yaw += st.velY; st.pitch += st.velX; st.velY *= 0.94; st.velX *= 0.94; }
          st.pitch = clamp(st.pitch, -85, 85);
          rotator.setAttribute('rotation', `${st.pitch} ${st.yaw} 0`);
          requestAnimationFrame(tick);
        })();
        const pd = e => { st.dragging = true; st.lastX = e.clientX; st.lastY = e.clientY; st.velX = 0; st.velY = 0; };
        const pu = () => { st.dragging = false; };
        const pm = e => {
          if (!st.dragging) return;
          const dx = e.clientX - st.lastX, dy = e.clientY - st.lastY;
          st.lastX = e.clientX; st.lastY = e.clientY;
          st.yaw += dx * 0.5; st.pitch += dy * 0.5;
          st.velY = dx * 0.5; st.velX = dy * 0.5;
        };
        canvas.addEventListener('pointerdown', e => { e.preventDefault(); pd(e); }, { passive: false });
        canvas.addEventListener('pointerup',   e => { e.preventDefault(); pu(e); }, { passive: false });
        canvas.addEventListener('pointerleave',e => { e.preventDefault(); pu(e); }, { passive: false });
        canvas.addEventListener('pointermove', e => { e.preventDefault(); pm(e); }, { passive: false });
        canvas.addEventListener('wheel', e => {
          e.preventDefault();
          st.dist = clamp(st.dist + Math.sign(e.deltaY) * 0.15, st.min, st.max);
          cameraRig.setAttribute('position', `0 0 ${st.dist}`);
        }, { passive: false });
        let lastPinchDist = 0;
        canvas.addEventListener('touchmove', e => {
          if (e.touches.length === 2) {
            e.preventDefault();
            const [a, b] = e.touches, d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            if (lastPinchDist) {
              const delta = (lastPinchDist - d) / 200;
              st.dist = clamp(st.dist + delta, st.min, st.max);
              cameraRig.setAttribute('position', `0 0 ${st.dist}`);
            }
            lastPinchDist = d;
          }
        }, { passive: false });
        canvas.addEventListener('touchend', () => { lastPinchDist = 0; }, { passive: false });

        log('✅ Demo 3D listo.');
      });
    }

    // ===== MODO AR (MindAR) =====
    function startAR(){
      document.getElementById('screen').style.display='none';
      if(!isSecure || !navigator.mediaDevices?.getUserMedia) { log('❌ Sin HTTPS o soporte de cámara.'); return; }

      const sceneHTML = `
        <a-scene id="arScene"
          mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.001; filterBeta: 0.01;"
          renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
          vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:true" embedded>
          
          <a-assets timeout="30000"><a-asset-item id="covidModelAR" src="./covid.glb"></a-asset-item></a-assets>

          <a-entity light="type: ambient; intensity: 1.0"></a-entity>
          <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

          <a-entity id="anchor" mindar-image-target="targetIndex:0">
            <a-box id="test-box" position="0 0.1 0" scale="0.2 0.2 0.2" material="color: cyan" visible="false"></a-box>
            
            <a-gltf-model id="mAR" src="#covidModelAR" scale="0.1 0.1 0.1" position="0 0 0" rotation="0 0 0"></a-gltf-model>
          </a-entity>

          <a-camera position="0 0 -10" look-controls="enabled: false"></a-camera>
        </a-scene>
      `;
      document.body.insertAdjacentHTML('beforeend', sceneHTML);

      const scene = document.getElementById('arScene');
      scene.addEventListener('renderstart', ()=> log('🎥 Cámara activa'));
      
      const anchor = document.getElementById('anchor');
      const modelAR = document.getElementById('mAR');
      const testBox = document.getElementById('test-box');

      if (anchor) {
        anchor.addEventListener('targetFound', () => {
          log('🔵 Marcador ENCONTRADO');
          modelAR.object3D.visible = true;
          // testBox.object3D.visible = true; // Descomenta para probar con el cubo
        });
        anchor.addEventListener('targetLost', () => {
          log('⚪ Marcador PERDIDO');
          modelAR.object3D.visible = false;
          // testBox.object3D.visible = false; // Descomenta para probar con el cubo
        });
      }
      
      log('✅ Escena AR lista. Apunta al marcador.');
    }

    // ---------- INICIALIZACIÓN ----------
    document.getElementById('btnDemo').addEventListener('click', startDemo);
    document.getElementById('btnAR').addEventListener('click', startAR);
  </script>
</body>

</html>
