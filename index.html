<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, shrink-to-fit=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WebAR con MindAR – Image Tracking</title>
    
    <!-- OPCIÓN A: Librerías locales (recomendado) -->
    <!-- Descarga y sube estos archivos a tu repositorio:
         1. aframe.min.js (desde https://github.com/aframevr/aframe/releases/tag/v1.4.0)
         2. mindar-image-aframe.prod.js (desde mind-ar releases)
         Luego descomenta estas líneas: -->
    
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    
    
    <!-- OPCIÓN B: Fallback usando GitHub raw (temporal) -->
    <script src="https://raw.githubusercontent.com/aframevr/aframe/v1.4.0/dist/aframe.min.js"></script>
    <script>
        // Verificar que A-Frame se cargó
        function checkAFrame() {
            if (typeof AFRAME !== 'undefined') {
                console.log('✅ A-Frame cargado correctamente');
                loadMindAR();
            } else {
                console.log('⏳ Esperando A-Frame...');
                setTimeout(checkAFrame, 100);
            }
        }
        
        function loadMindAR() {
            const script = document.createElement('script');
            script.src = 'https://raw.githubusercontent.com/hiukim/mind-ar-js/master/dist/mindar-image-aframe.prod.js';
            script.onload = () => {
                console.log('✅ MindAR cargado');
                window.AR_READY = true;
            };
            script.onerror = () => {
                console.error('❌ Error cargando MindAR');
                createSimplifiedAR();
            };
            document.head.appendChild(script);
        }
        
        setTimeout(checkAFrame, 100);
    </script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Ocultar barras del navegador en móvil */
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        #ui {
            position: fixed;
            top: 20px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        
        #ui .chip {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #cameraPermission {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }
        
        #cameraPermission button {
            padding: 12px 24px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        
        #cameraPermission button:hover {
            background: linear-gradient(45deg, #45a049, #4CAF50);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        
        #help {
            position: fixed;
            bottom: 20px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            line-height: 1.4;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        a-scene {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        
        /* Asegurar que la cámara de fondo sea visible */
        a-scene canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        .a-enter-vr {
            display: none !important;
        }
        
        #debug {
            position: fixed;
            bottom: 100px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 10px;
            max-height: 60px;
            overflow-y: auto;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Estilos específicos para móvil */
        @media (max-width: 768px) {
            #ui .chip {
                font-size: 10px;
                padding: 6px 10px;
            }
            
            #help {
                font-size: 10px;
                bottom: 10px;
            }
            
            #debug {
                bottom: 70px;
                font-size: 9px;
            }
        }
        
        /* Prevenir zoom en inputs táctiles */
        @media (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body>
    <div id="cameraPermission">
        <h3>📱 WebAR Ready</h3>
        <p>Necesitamos acceso a tu cámara para el AR</p>
        <button onclick="requestCameraAndStart()">
            🎥 Activar Cámara
        </button>
        <div style="margin-top: 10px; font-size: 11px; opacity: 0.7;">
            Asegúrate de permitir el acceso
        </div>
    </div>
    
    <div id="loading" style="display: none;">
        <div class="spinner"></div>
        <div id="loadingText">Iniciando AR...</div>
    </div>
    
    <div id="ui" style="display: none;">
        <div class="chip">📷 Apunta al marcador impreso</div>
        <div class="chip">🔄 Toca para interactuar</div>
    </div>
    
    <div id="debug"></div>
    
    <!-- La escena se crea dinámicamente -->

    <div id="help" style="display: none;">
        <strong>💡 Consejos:</strong><br>
        • Mantén buena iluminación<br>
        • Apunta directamente al marcador<br>
        • Si no aparece, mueve el teléfono lentamente
    </div>

    <script>
        let debugLogs = [];
        let arScene;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        function log(message) {
            console.log(message);
            debugLogs.push(message);
            const debugEl = document.getElementById('debug');
            if (debugEl && debugLogs.length <= 4) {
                debugEl.innerHTML = debugLogs.slice(-4).join('<br>');
            }
        }

        function updateLoadingText(text) {
            const loadingText = document.getElementById('loadingText');
            if (loadingText) loadingText.textContent = text;
            log(text);
        }

        // Solicitar permisos de cámara explícitamente
        async function requestCameraAndStart() {
            log('📱 Solicitando permisos de cámara...');
            
            try {
                // Solicitar permisos explícitamente
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment', // Cámara trasera
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                log('✅ Permisos de cámara otorgados');
                
                // Detener el stream temporal
                stream.getTracks().forEach(track => track.stop());
                
                // Ocultar pantalla de permisos
                document.getElementById('cameraPermission').style.display = 'none';
                document.getElementById('loading').style.display = 'block';
                
                // Inicializar AR
                initializeAR();
                
            } catch (error) {
                log('❌ Error de cámara: ' + error.message);
                alert('❌ No se pudo acceder a la cámara. Verifica los permisos en la configuración del navegador.');
            }
        }

        function initializeAR() {
            log('🚀 Inicializando AR...');
            
            if (!checkCompatibility()) {
                return;
            }

            updateLoadingText('Verificando librerías...');
            
            setTimeout(() => {
                if (typeof AFRAME !== 'undefined') {
                    log('✅ A-Frame OK');
                    waitForARReady();
                } else {
                    log('❌ A-Frame falló');
                    showError('Error cargando A-Frame');
                }
            }, 1000);
        }

        function checkCompatibility() {
            const isHTTPS = location.protocol === 'https:' || location.hostname === 'localhost';
            const hasUserMedia = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
            
            log(`🔍 HTTPS: ${isHTTPS}, Camera: ${hasUserMedia}, Mobile: ${isMobile}`);
            
            if (!isHTTPS) {
                showError('Se requiere HTTPS para WebAR');
                return false;
            }
            
            if (!hasUserMedia) {
                showError('Tu navegador no soporta acceso a cámara');
                return false;
            }
            
            return true;
        }

        function waitForARReady() {
            if (window.AR_READY) {
                log('🚀 Todo listo, creando AR');
                checkFiles();
                createARScene();
            } else {
                log('⏳ Esperando MindAR...');
                setTimeout(waitForARReady, 200);
            }
        }

        function createARScene() {
            log('🎬 Creando escena AR completa');
            updateLoadingText('Configurando AR...');
            
            const sceneHTML = `
            <a-scene
                id="arScene"
                mindar-image="
                    imageTargetSrc: ./targets.mind; 
                    maxTrack: 1; 
                    warmupTolerance: 5; 
                    missTolerance: 5;
                    showStats: false;
                "
                color-space="sRGB"
                renderer="
                    colorManagement: true; 
                    physicallyCorrectLights: true;
                    alpha: true;
                    antialias: true;
                "
                vr-mode-ui="enabled: false"
                device-orientation-permission-ui="enabled: false"
                loading-screen="enabled: false"
                background="transparent"
                embedded
            >
                <a-assets>
                    <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
                </a-assets>

                <!-- Luces optimizadas para AR -->
                <a-light type="ambient" intensity="0.4" color="#ffffff"></a-light>
                <a-light type="directional" position="0 1 0" intensity="0.3" color="#ffffff"></a-light>

                <!-- Target entity para el marcador -->
                <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
                    <a-gltf-model 
                        id="model3d"
                        src="#covidModel" 
                        position="0 0 0" 
                        rotation="0 0 0" 
                        scale="0.1 0.1 0.1"
                        animation-mixer="clip: *; loop: repeat"
                        shadow="cast: true; receive: false"
                    >
                    </a-gltf-model>
                </a-entity>

                <!-- Cámara configurada para AR -->
                <a-camera 
                    id="arCamera"
                    position="0 0 0"
                    look-controls="enabled: false"
                    wasd-controls="enabled: false"
                    cursor="rayOrigin: mouse"
                ></a-camera>
            </a-scene>
            `;

            document.body.insertAdjacentHTML('beforeend', sceneHTML);
            setTimeout(setupAREvents, 800);
        }

        function setupAREvents() {
            arScene = document.querySelector('#arScene');
            
            if (!arScene) {
                log('❌ Error creando escena');
                showError('Error creando escena AR');
                return;
            }

            log('🎯 Configurando eventos AR...');

            // Evento cuando MindAR inicia el render
            arScene.addEventListener('renderstart', function() {
                log('✅ AR iniciado - cámara de fondo activa');
                setTimeout(() => {
                    hideLoading();
                    showUI();
                }, 1500);
            });

            // Eventos de detección de marcador
            const targetEntity = document.querySelector('#targetEntity');
            if (targetEntity) {
                targetEntity.addEventListener('targetFound', function() {
                    log('🎯 ¡Marcador detectado!');
                    const model = document.querySelector('#model3d');
                    if (model) {
                        // Animación de aparición
                        model.setAttribute('animation__scale', {
                            property: 'scale',
                            from: '0 0 0',
                            to: '0.15 0.15 0.15',
                            dur: 800,
                            easing: 'easeOutBack'
                        });
                        
                        // Rotación continua
                        model.setAttribute('animation__rotate', {
                            property: 'rotation',
                            to: '0 360 0',
                            loop: true,
                            dur: 8000
                        });
                        
                        // Flotar suavemente
                        model.setAttribute('animation__float', {
                            property: 'position',
                            to: '0 0.1 0',
                            dir: 'alternate',
                            loop: true,
                            dur: 3000,
                            easing: 'easeInOutSine'
                        });
                    }
                    
                    // Actualizar UI
                    updateChipText('🎯 ¡Marcador detectado!');
                });

                targetEntity.addEventListener('targetLost', function() {
                    log('❌ Marcador perdido');
                    const model = document.querySelector('#model3d');
                    if (model) {
                        model.removeAttribute('animation__rotate');
                        model.removeAttribute('animation__float');
                    }
                    updateChipText('📷 Busca el marcador...');
                });
            }

            updateLoadingText('Activando cámara...');
            
            // Timeout de seguridad más largo para móviles
            setTimeout(() => {
                if (document.getElementById('loading').style.display !== 'none') {
                    log('⏰ Timeout - forzando inicio');
                    hideLoading();
                    showUI();
                }
            }, 12000);
        }

        function updateChipText(text) {
            const chips = document.querySelectorAll('#ui .chip');
            if (chips[0]) {
                chips[0].textContent = text;
            }
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            setTimeout(() => {
                const debug = document.getElementById('debug');
                if (debug) debug.style.display = 'none';
            }, 5000);
        }

        function showUI() {
            const ui = document.querySelector('#ui');
            const help = document.querySelector('#help');
            
            if (ui) ui.style.display = 'flex';
            if (help) help.style.display = 'block';
        }

        function showError(message) {
            document.getElementById('loading').innerHTML = `
                <div style="color: #ff6b6b; font-size: 18px; margin-bottom: 12px;">❌ Error</div>
                <div style="font-size: 14px; margin-bottom: 15px;">${message}</div>
                <button onclick="location.reload()" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    🔄 Reintentar
                </button>
            `;
            log(`❌ Error: ${message}`);
        }

        async function checkFiles() {
            const files = [
                { path: './targets.mind', name: 'targets.mind' },
                { path: './covid.glb', name: 'covid.glb' }
            ];
            
            for (const file of files) {
                try {
                    const response = await fetch(file.path, { method: 'HEAD' });
                    log(`${response.ok ? '✅' : '❌'} ${file.name} ${response.ok ? 'OK' : 'faltante'}`);
                } catch (error) {
                    log(`❌ ${file.name} error`);
                }
            }
        }

        // Prevenir zoom en móvil
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gesturechange', function (e) {
            e.preventDefault();
        });

        document.addEventListener('gestureend', function (e) {
            e.preventDefault();
        });

        // Manejar orientación en móvil
        if (isMobile) {
            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    if (arScene) {
                        // Forzar redimensionado
                        arScene.resize();
                    }
                }, 500);
            });
        }

        window.addEventListener('error', function(e) {
            log(`💥 Error: ${e.error?.message || 'Desconocido'}`);
        });

        // Inicializar automáticamente en PC, manualmente en móvil
        document.addEventListener('DOMContentLoaded', function() {
            log('📱 DOM listo');
            
            if (!isMobile) {
                // En PC, inicializar automáticamente
                setTimeout(() => {
                    document.getElementById('cameraPermission').style.display = 'none';
                    document.getElementById('loading').style.display = 'block';
                    initializeAR();
                }, 500);
            }
            // En móvil, mostrar botón de permisos
        });
    </script>
</body>
</html>
