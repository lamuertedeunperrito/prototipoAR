<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>WebAR con MindAR – Image Tracking</title>
    
    <!-- A-Frame primero -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.0/aframe.min.js"></script>
    
    <!-- MindAR después de A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        #ui {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        
        #ui .chip {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
        
        #help {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            line-height: 1.4;
            backdrop-filter: blur(10px);
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        a-scene {
            width: 100vw;
            height: 100vh;
        }
        
        /* Ocultar controles de A-Frame que no necesitamos */
        .a-enter-vr {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Cargando AR...</div>
    </div>
    
    <div id="ui" style="display: none;">
        <div class="chip">📷 Apunta al marcador impreso</div>
        <div class="chip">🔄 Toca y arrastra para rotar</div>
    </div>
    
    <a-scene
        id="arScene"
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; warmupTolerance: 5; missTolerance: 5"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
        embedded
        style="display: none;"
    >
        <a-assets>
            <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
        </a-assets>

        <!-- Luces -->
        <a-light type="ambient" intensity="0.8"></a-light>
        <a-light type="directional" position="2 4 5" intensity="0.5"></a-light>

        <!-- Entidad objetivo con el modelo 3D -->
        <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                id="model3d"
                src="#covidModel" 
                position="0 0 0" 
                rotation="0 0 0" 
                scale="0.3 0.3 0.3"
                animation-mixer
            >
            </a-gltf-model>
        </a-entity>

        <!-- Cámara -->
        <a-camera 
            position="0 0 0"
            look-controls="enabled: false"
            cursor="rayOrigin: mouse"
        ></a-camera>
    </a-scene>

    <div id="help" style="display: none;">
        <strong>💡 Consejos:</strong><br>
        • Usa Chrome o Safari nativo (no Instagram/Facebook)<br>
        • Asegúrate de estar en HTTPS<br>
        • Permite acceso a la cámara<br>
        • Mantén buena iluminación y estabilidad
    </div>

    <script>
        let arScene;
        let isARStarted = false;

        // Esperar a que todo esté cargado
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM cargado, iniciando AR...');
            
            arScene = document.querySelector('#arScene');
            
            if (!arScene) {
                console.error('No se encontró la escena AR');
                return;
            }

            // Eventos de MindAR
            arScene.addEventListener('renderstart', function() {
                console.log('MindAR: Render iniciado');
                hideLoading();
                showUI();
            });

            // Cuando se detecta el target
            const targetEntity = document.querySelector('#targetEntity');
            if (targetEntity) {
                targetEntity.addEventListener('targetFound', function() {
                    console.log('Target encontrado!');
                    // Opcional: agregar animación cuando se detecta
                    const model = document.querySelector('#model3d');
                    if (model) {
                        model.setAttribute('animation', {
                            property: 'rotation',
                            to: '0 360 0',
                            loop: true,
                            dur: 10000
                        });
                    }
                });

                targetEntity.addEventListener('targetLost', function() {
                    console.log('Target perdido');
                    // Opcional: detener animación
                    const model = document.querySelector('#model3d');
                    if (model) {
                        model.removeAttribute('animation');
                    }
                });
            }

            // Inicializar después de un breve delay
            setTimeout(initializeAR, 500);
        });

        function initializeAR() {
            console.log('Inicializando AR...');
            
            try {
                // Mostrar la escena
                arScene.style.display = 'block';
                
                // Forzar inicio si no se ha iniciado automáticamente
                if (!isARStarted) {
                    console.log('Forzando inicio de AR...');
                    isARStarted = true;
                }
                
            } catch (error) {
                console.error('Error al inicializar AR:', error);
                showError('Error al inicializar AR: ' + error.message);
            }
        }

        function hideLoading() {
            const loading = document.querySelector('#loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }

        function showUI() {
            const ui = document.querySelector('#ui');
            const help = document.querySelector('#help');
            
            if (ui) ui.style.display = 'flex';
            if (help) help.style.display = 'block';
        }

        function showError(message) {
            const loading = document.querySelector('#loading');
            if (loading) {
                loading.innerHTML = `
                    <div style="color: #ff6b6b; font-size: 16px;">❌ Error</div>
                    <div style="margin-top: 8px; font-size: 12px;">${message}</div>
                `;
            }
        }

        // Manejo de errores globales
        window.addEventListener('error', function(e) {
            console.error('Error global:', e.error);
        });

        // Verificar compatibilidad de dispositivo
        function checkCompatibility() {
            const isHTTPS = location.protocol === 'https:' || location.hostname === 'localhost';
            const hasUserMedia = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
            
            if (!isHTTPS) {
                showError('Se requiere HTTPS para acceder a la cámara');
                return false;
            }
            
            if (!hasUserMedia) {
                showError('Tu navegador no soporta acceso a cámara');
                return false;
            }
            
            return true;
        }

        // Verificar compatibilidad al cargar
        if (!checkCompatibility()) {
            console.warn('Dispositivo no compatible');
        }
    </script>
</body>
</html>
