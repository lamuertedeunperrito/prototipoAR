<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Visor Cardboard 360 (Equirectangular)</title>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; }
    #ui { position: fixed; inset: auto 0 0 0; background: linear-gradient(transparent, rgba(0,0,0,.75)); padding: 10px 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; z-index: 10; transition: opacity 0.3s; }
    .row { display:flex; align-items:center; gap:6px; }
    input[type="range"] { width: 140px; }
    #msg { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 10px; font-size: 12px; z-index: 10; text-align: center; }
    #canvas { display:block; width:100vw; height:100vh; }
    #status { position: fixed; right: 8px; bottom: 80px; background: rgba(0,0,0,.55); padding:6px 8px; border-radius:8px; font-size:12px; z-index: 10; }
    button { background:#0a84ff; border:none; color:#fff; padding:10px 12px; border-radius:10px; font-weight:600; cursor:pointer; }
    #fsBtn { background:#14b8a6; }
    #resetBtn { background:#f59e0b; }
    #gyroBtn { background:#7c3aed; }
  </style>
</head>
<body>
  <div id="msg">Carga una foto 360° (formato 2:1) y presiona 🧭 para activar el sensor de movimiento.</div>
  <div id="status">Estado: <span id="st">inicializando…</span></div>

  <input id="file" type="file" accept="image/*" style="position:fixed; left:10px; top:10px; z-index:10; background:#111; color:#fff; border:1px solid #333; border-radius:10px; padding:8px;" />
  <canvas id="canvas"></canvas>

  <div id="ui">
    <button id="gyroBtn">🧭 Habilitar Giroscopio</button>
    <button id="fsBtn">⤢ Pantalla Completa</button>
    <button id="resetBtn">🔄 Resetear Vista</button>
    <div class="row">
      <label>FOV</label>
      <input id="fov" type="range" min="40" max="110" step="1" value="80" />
      <span id="fovVal">80°</span>
    </div>
    <div class="row">
      <label>IPD</label>
      <input id="ipd" type="range" min="0" max="0.12" step="0.002" value="0.064" />
      <span id="ipdVal">64 mm</span>
    </div>
    <div class="row">
      <label>Giro Y</label>
      <input id="yaw" type="range" min="-180" max="180" step="1" value="0" />
      <span id="yawVal">0°</span>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.164.1/build/three.min.js"></script>
  <script>
  const stEl = document.getElementById('st');
  function setStatus(t){ stEl.textContent = t; console.log('[visor360]', t); }

  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: false});
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  renderer.autoClear = false;
  renderer.setScissorTest(true);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const sphereGeom = new THREE.SphereGeometry(50, 64, 32);
  sphereGeom.scale(-1, 1, 1);
  let sphereMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.BackSide });
  const sphere = new THREE.Mesh(sphereGeom, sphereMat);
  scene.add(sphere);

  const fovEl = document.getElementById('fov');
  const fovVal = document.getElementById('fovVal');
  const yawEl = document.getElementById('yaw');
  const yawVal = document.getElementById('yawVal');
  const ipdEl = document.getElementById('ipd');
  const ipdVal = document.getElementById('ipdVal');

  let fov = parseInt(fovEl.value,10);
  const leftCam = new THREE.PerspectiveCamera(fov, 0.5, 0.01, 200);
  const rightCam = new THREE.PerspectiveCamera(fov, 0.5, 0.01, 200);
  let ipd = parseFloat(ipdEl.value);

  const rig = new THREE.Object3D();
  scene.add(rig);
  rig.add(leftCam); rig.add(rightCam);

  function updateCameras(){
    fov = parseInt(fovEl.value,10); fovVal.textContent = fov + '°';
    leftCam.fov = rightCam.fov = fov;
    leftCam.updateProjectionMatrix(); rightCam.updateProjectionMatrix();

    ipd = parseFloat(ipdEl.value); ipdVal.textContent = Math.round(ipd*1000) + ' mm';
    leftCam.position.set(-ipd/2, 0, 0);
    rightCam.position.set(ipd/2, 0, 0);
  }
  updateCameras();
  fovEl.addEventListener('input', updateCameras);
  ipdEl.addEventListener('input', updateCameras);

  // --- Lógica de Rotación Corregida ---
  let haveSensors = false;
  const screenOrientation = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2); // para ajustar la orientación de paisaje
  const deviceQuaternion = new THREE.Quaternion();
  const manualOffsetQuaternion = new THREE.Quaternion(); // Offset para el slider de Yaw y el reseteo
  let latestDeviceQuaternion = new THREE.Quaternion(); // Almacena la última orientación cruda del dispositivo

  function eulerFromDevice(alpha, beta, gamma){
    const euler = new THREE.Euler();
    euler.set(THREE.MathUtils.degToRad(beta||0), THREE.MathUtils.degToRad(alpha||0), THREE.MathUtils.degToRad(-gamma||0), 'YXZ');
    deviceQuaternion.setFromEuler(euler);
    deviceQuaternion.multiply(screenOrientation);
    return deviceQuaternion;
  }

  yawEl.addEventListener('input', () => {
    const y = parseInt(yawEl.value,10); yawVal.textContent = y + '°';
    const yawRad = THREE.MathUtils.degToRad(y);
    if (!haveSensors) {
        // Si no hay giroscopio, rotamos el rig directamente
        rig.rotation.y = yawRad;
    } else {
        // Si hay giroscopio, actualizamos el offset manual basado en la última orientación del dispositivo
        const baseRotation = latestDeviceQuaternion.clone().invert();
        const yawRotation = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yawRad);
        manualOffsetQuaternion.multiplyQuaternions(baseRotation, yawRotation);
    }
  });

  async function enableGyro(){
    if (haveSensors) return;
    try{
      const doe = window.DeviceOrientationEvent;
      if (typeof doe.requestPermission === 'function') {
        const status = await doe.requestPermission();
        if(status !== 'granted') throw new Error('Permiso de orientación denegado');
      }
      haveSensors = true;
      window.addEventListener('deviceorientation', (e)=>{
        if(!e.alpha) return; // a veces el primer evento viene nulo
        latestDeviceQuaternion = eulerFromDevice(e.alpha, e.beta, e.gamma);
      }, true);
      document.getElementById('gyroBtn').style.background = '#4caf50'; // color verde para indicar que está activo
      setStatus('Giroscopio habilitado');
      try{ await screen.orientation.lock('landscape'); }catch(_){ }
      // Al activar el giroscopio, hacemos un reseteo inicial
      document.getElementById('resetBtn').click();
    }catch(err){ setStatus('⚠️ No se pudo habilitar: '+err.message); }
  }
  document.getElementById('gyroBtn').addEventListener('click', enableGyro);

  const file = document.getElementById('file');
  file.addEventListener('change', () => {
    const img = file.files && file.files[0];
    if (!img) return;
    const url = URL.createObjectURL(img);
    const texture = new THREE.TextureLoader().load(url, ()=>{
      setStatus('Textura 360 cargada');
      sphere.material.dispose();
      sphereMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
      sphere.material = sphereMat;
      URL.revokeObjectURL(url);
    }, undefined, (err)=>{
      setStatus('❌ Error cargando textura'); console.error(err);
    });
  });

  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    leftCam.aspect = 0.5 * w / h; rightCam.aspect = 0.5 * w / h;
    leftCam.updateProjectionMatrix(); rightCam.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  function render(){
    if (haveSensors) {
        const finalQuaternion = latestDeviceQuaternion.clone().multiply(manualOffsetQuaternion);
        rig.quaternion.slerp(finalQuaternion, 0.2); // slerp para suavizar el movimiento
    }
    
    const w = renderer.domElement.width;
    const h = renderer.domElement.height;
    renderer.clear();

    renderer.setViewport(0, 0, w/2, h);
    renderer.setScissor(0, 0, w/2, h);
    renderer.render(scene, leftCam);

    renderer.setViewport(w/2, 0, w/2, h);
    renderer.setScissor(w/2, 0, w/2, h);
    renderer.render(scene, rightCam);

    requestAnimationFrame(render);
  }
  render();

  document.getElementById('fsBtn').addEventListener('click', async ()=>{
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
        document.getElementById('ui').style.opacity = '0';
        setStatus('Pantalla completa');
      } else {
        await document.exitFullscreen();
        setStatus('Salió de pantalla completa');
      }
    }catch(e){ alert('Pantalla completa no disponible: '+e.message); }
  });
  
  document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
          document.getElementById('ui').style.opacity = '1';
      }
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    yawEl.value = 0; yawVal.textContent = '0°';
    if (haveSensors && latestDeviceQuaternion) {
        // El nuevo offset es la inversa de la orientación actual del dispositivo.
        // Esto hace que la dirección actual se convierta en el nuevo "frente".
        manualOffsetQuaternion.copy(latestDeviceQuaternion).invert();
    } else {
        // Si no hay giroscopio, simplemente reseteamos la rotación manual
        manualOffsetQuaternion.identity();
        rig.rotation.set(0,0,0);
    }
    setStatus('Vista reiniciada');
  });

  if ('wakeLock' in navigator) { navigator.wakeLock.request('screen').catch(()=>{}); }
  setStatus('Listo: carga una imagen');
  </script>
</body>
</html>
