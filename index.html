<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR (MindAR) + Demo 3D</title>

  <!-- A-Frame LOCAL -->
  <script src="./aframe.min.js"></script>

  <!-- MindAR A-Frame LOCAL (dist v1.2.5 copiado en /mindar) -->
  <script src="./mindar/mindar-image-aframe.prod.js"></script>

  <style>
    :root { --bg:#0b0f13; --chip:#ffffff18; }
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    #screen{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--bg);color:#fff;padding:20px;text-align:center}
    .btn{padding:12px 16px;border-radius:12px;border:1px solid #ffffff26;background:var(--chip);color:#fff;font-weight:600;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    #log{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;color:#0ff;background:#001014cc;padding:8px 10px;border-radius:10px;font:12px/1.3 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:34vh;overflow:auto}
    #demoWrap{position:fixed;inset:0;background:#fff;display:none}
    a-scene{position:fixed;inset:0}
    .hint{opacity:.8;font-size:12px}
  </style>
</head>
<body>
  <div id="screen">
    <div style="font-size:18px;opacity:.9">Prototipo: MindAR (marker) + Demo 3D</div>
    <div class="row">
      <button class="btn" id="btnAR">🚀 Iniciar AR (marcador)</button>
      <button class="btn" id="btnDemo">🎮 Demo 3D (sin AR)</button>
    </div>
    <div class="hint">AR requiere HTTPS + cámara en navegador nativo (Chrome/Safari). Demo 3D funciona en todo.</div>
  </div>

  <div id="demoWrap"></div>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    const log = m => { console.log(m); logEl.textContent += (logEl.textContent?'\n':'') + m; logEl.scrollTop = logEl.scrollHeight; };
    const isSecure = location.protocol.startsWith('https') || location.hostname === 'localhost';
    if(!isSecure) log('⚠️ Requiere HTTPS para usar la cámara.');
    if(!window.AFRAME) log('❌ A-Frame NO cargó (revisa aframe.min.js).');

    // ================= DEMO 3D (sin AR) =================
    function startDemo(){
      document.getElementById('screen').style.display='none';
      const wrap = document.getElementById('demoWrap');
      wrap.style.display='block';

      wrap.innerHTML = `
        <a-scene id="demoScene" background="color: #ffffff" renderer="colorManagement:true" vr-mode-ui="enabled:false">
          <a-assets><a-asset-item id="covidModel" src="./covid.glb"></a-asset-item></a-assets>

          <a-entity light="type: ambient; intensity: 0.9"></a-entity>
          <a-entity light="type: directional; intensity: 0.9" position="1 1 1"></a-entity>

          <!-- Más cerca y más grande -->
          <a-entity id="pivot" position="0 1.2 -1.2">
            <a-gltf-model id="model3d" src="#covidModel" rotation="0 0 0" scale="0.35 0.35 0.35"></a-gltf-model>
          </a-entity>

          <a-camera id="cam" position="0 1.2 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
        </a-scene>
      `;

      const scene = document.getElementById('demoScene');
      scene.addEventListener('loaded', ()=>{
        const pivot = document.getElementById('pivot');
        const canvas = scene.renderer.domElement;

        // Estado para gestos + inercia
        const st = {
          dragging:false, lastX:0, rotY:0,
          velY:0, // velocidad angular para inercia
          auto:true, // auto-rotación cuando no hay interacción
          dist:1.2, min:0.6, max:5.0
        };

        // Animación por cuadro (auto-rotación + inercia)
        (function tick(){
          if(st.auto) st.rotY += 0.15;
          // inercia: fricción suave
          if(Math.abs(st.velY) > 0.001){
            st.rotY += st.velY;
            st.velY *= 0.95; // fricción
          } else {
            st.velY = 0;
          }
          const r = pivot.getAttribute('rotation');
          pivot.setAttribute('rotation', {x:r.x, y:st.rotY, z:r.z});
          requestAnimationFrame(tick);
        })();

        // Arrastre para rotar (con inercia al soltar)
        const pd = e=>{ st.dragging=true; st.auto=false; st.lastX=e.clientX; st.velY=0; };
        const pu = ()=>{
          st.dragging=false;
          setTimeout(()=> st.auto = (Math.abs(st.velY)<0.02), 1200);
        };
        const pm = e=>{
          if(!st.dragging) return;
          const dx = e.clientX - st.lastX;
          st.lastX = e.clientX;
          st.rotY += dx*0.4;
          st.velY  = dx*0.04; // acumula velocidad para inercia
        };
        canvas.addEventListener('pointerdown', pd);
        canvas.addEventListener('pointerup', pu);
        canvas.addEventListener('pointerleave', pu);
        canvas.addEventListener('pointermove', pm);

        // Zoom con rueda
        canvas.addEventListener('wheel', e=>{
          e.preventDefault();
          st.dist = clamp(st.dist + Math.sign(e.deltaY)*0.2, st.min, st.max);
          pivot.setAttribute('position', `0 1.2 ${-st.dist}`);
        }, {passive:false});

        // Zoom con pinza
        let lastDist=0;
        canvas.addEventListener('touchmove', e=>{
          if(e.touches && e.touches.length===2){
            const [a,b]=e.touches, dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
            const d=Math.hypot(dx,dy);
            if(lastDist){
              const delta=(lastDist-d)/350; // sensibilidad
              st.dist = clamp(st.dist + delta, st.min, st.max);
              pivot.setAttribute('position', `0 1.2 ${-st.dist}`);
              st.auto=false;
            }
            lastDist=d;
          }
        }, {passive:true});
        canvas.addEventListener('touchend', ()=>{ lastDist=0; setTimeout(()=> st.auto=true, 1000); });

        function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
        log('✅ Demo 3D listo (más cerca + inercia).');
      });
    }

    // ================= AR con MindAR =================
    function startAR(){
      document.getElementById('screen').style.display='none';
      if(!isSecure){ log('❌ Sin HTTPS: la cámara no abrirá.'); return; }
      if(!navigator.mediaDevices?.getUserMedia){ log('❌ Este navegador no soporta cámara.'); return; }

      const sceneHTML = `
        <a-scene
          id="arScene"
          mindar-image="imageTargetSrc: ./targets.mind;"
          renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:true"
          vr-mode-ui="enabled:false"
          device-orientation-permission-ui="enabled:true"
          embedded>
          <a-assets><a-asset-item id="covidModel" src="./covid.glb"></a-asset-item></a-assets>

          <a-entity light="type: ambient; intensity: 1.0"></a-entity>
          <a-entity light="type: directional; intensity: 0.9" position="1 1 1"></a-entity>

          <a-entity id="anchor" mindar-image-target="targetIndex:0">
            <!-- Pivot para manipular y auto-rotar -->
            <a-entity id="pivotAR" position="0 0 0">
              <a-gltf-model id="mAR" src="#covidModel" position="0 0 0" rotation="0 0 0" scale="0.18 0.18 0.18"></a-gltf-model>
            </a-entity>
          </a-entity>

          <a-camera position="0 0 0"></a-camera>
        </a-scene>
      `;
      document.body.insertAdjacentHTML('beforeend', sceneHTML);

      const scene = document.getElementById('arScene');
      scene.addEventListener('loaded', ()=>{
        log('✅ Escena AR cargada');
        const pivot = document.getElementById('pivotAR');
        const canvas = scene.renderer.domElement;

        // Estado de interacción AR
        const st = { dragging:false, lastX:0, rotY:0, auto:true, velY:0, scale:0.18, min:0.06, max:1.2 };

        // Auto-rotación suave
        (function tick(){
          if(st.auto) st.rotY += 0.12;
          if(Math.abs(st.velY)>0.001){ st.rotY += st.velY; st.velY *= 0.95; } else { st.velY=0; }
          const r = pivot.getAttribute('rotation');
          pivot.setAttribute('rotation', {x:r.x, y:st.rotY, z:r.z});
          requestAnimationFrame(tick);
        })();

        // Rotación por arrastre (con inercia)
        const pd = e=>{ st.dragging=true; st.auto=false; st.lastX=e.clientX; st.velY=0; };
        const pu = ()=>{ st.dragging=false; setTimeout(()=> st.auto=(Math.abs(st.velY)<0.02), 1000); };
        const pm = e=>{
          if(!st.dragging) return;
          const dx=e.clientX-st.lastX; st.lastX=e.clientX;
          st.rotY += dx*0.35;
          st.velY  = dx*0.035;
        };
        canvas.addEventListener('pointerdown', pd);
        canvas.addEventListener('pointerup', pu);
        canvas.addEventListener('pointerleave', pu);
        canvas.addEventListener('pointermove', pm);

        // Zoom con pinza (escala del modelo)
        let lastDist=0;
        canvas.addEventListener('touchmove', e=>{
          if(e.touches && e.touches.length===2){
            const [a,b]=e.touches, dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
            const d=Math.hypot(dx,dy);
            if(lastDist){
              const delta=(d-lastDist)/800; // sensibilidad
              st.scale = clamp(st.scale + delta, st.min, st.max);
              pivot.setAttribute('scale', `${st.scale} ${st.scale} ${st.scale}`);
              st.auto=false;
            }
            lastDist=d;
          }
        }, {passive:true});
        canvas.addEventListener('touchend', ()=>{ lastDist=0; setTimeout(()=> st.auto=true, 1200); });

        function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
      });

      scene.addEventListener('renderstart', ()=> log('🎥 Cámara activa'));
      setTimeout(()=>{
        const a=document.getElementById('anchor');
        if(a){
          a.addEventListener('targetFound', ()=> log('🔵 target FOUND'));
          a.addEventListener('targetLost',  ()=> log('⚪ target LOST'));
        }
      }, 600);

      navigator.mediaDevices.getUserMedia({video:true})
        .then(s=>{ s.getTracks().forEach(t=>t.stop()); log('🔓 Permiso de cámara OK'); })
        .catch(err=> log('🔒 Cámara bloqueada: '+(err?.name||err)));
    }

    document.getElementById('btnDemo').addEventListener('click', startDemo);
    document.getElementById('btnAR').addEventListener('click', startAR);
  </script>
</body>
</html>
