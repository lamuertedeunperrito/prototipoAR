<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR (MindAR) + Demo 3D — estable</title>

  <!-- Librerías locales en la RAÍZ -->
  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>

  <style>
    :root { --bg:#0b0f13; --chip:#ffffff18; }
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
    #screen{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--bg);color:#fff;padding:20px;text-align:center}
    .btn{padding:12px 16px;border-radius:12px;border:1px solid #ffffff26;background:var(--chip);color:#fff;font-weight:600;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    #log{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;color:#0ff;background:#001014cc;padding:8px 10px;border-radius:10px;font:12px/1.3 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:34vh;overflow:auto}
    #demoWrap{position:fixed;inset:0;background:#fff;display:none}
    a-scene{position:fixed;inset:0}
    .hint{opacity:.8;font-size:12px}
  </style>
</head>
<body>
  <div id="screen">
    <div style="font-size:18px;opacity:.9">Prototipo: MindAR (marcador) + Demo 3D</div>
    <div class="row">
      <button class="btn" id="btnAR">🚀 Iniciar AR (marcador)</button>
      <button class="btn" id="btnDemo">🎮 Demo 3D (sin AR)</button>
    </div>
    <div class="hint">AR: arrastra para rotar, pinza/rueda para zoom (anclado). Demo: igual en fondo blanco.</div>
  </div>

  <div id="demoWrap"></div>
  <div id="log"></div>

  <script>
    // ---------- util ----------
    const logEl = document.getElementById('log');
    const log = m => { console.log(m); logEl.textContent += (logEl.textContent?'\n':'') + m; logEl.scrollTop = logEl.scrollHeight; };
    const isSecure = location.protocol.startsWith('https') || location.hostname === 'localhost';
    if(!isSecure) log('⚠️ Requiere HTTPS para usar la cámara.');
    if(!window.AFRAME) log('❌ A-Frame NO cargó (revisa aframe.min.js).');

    // Centrar y desactivar frustum-culling para evitar "desapariciones"
    AFRAME.registerComponent('center-model', {
      init(){
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if(!obj) return;
          const box = new THREE.Box3().setFromObject(obj);
          const center = box.getCenter(new THREE.Vector3());
          obj.position.sub(center);
          obj.traverse(n=>{ if(n.isMesh){ n.frustumCulled = false; n.castShadow = true; n.receiveShadow = true; } });
          obj.updateMatrixWorld(true);
        });
      }
    });

    // ===== DEMO =====
    function startDemo(){
      document.getElementById('screen').style.display='none';
      const wrap = document.getElementById('demoWrap');
      wrap.style.display='block';

      wrap.innerHTML = `
        <a-scene id="demoScene" background="color: #ffffff"
                 renderer="colorManagement:true; antialias:false" vr-mode-ui="enabled:false">
          <a-assets timeout="30000">
            <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
          </a-assets>

          <a-entity light="type: ambient; intensity: 1.0"></a-entity>
          <a-entity light="type: directional; intensity: 0.9" position="1 1 1"></a-entity>

          <!-- Estructura: pivot (distancia/zoom) -> rotator (rotación 2 ejes) -> model -->
          <a-entity id="pivot" position="0 0 -0.9">
            <a-entity id="rotator" rotation="0 0 0">
              <a-gltf-model id="model3d" src="#covidModel" center-model scale="1.0 1.0 1.0" position="0 0 0"></a-gltf-model>
            </a-entity>
          </a-entity>

          <a-entity camera="near:0.01; far:100" position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-entity>
        </a-scene>
      `;

      const scene = document.getElementById('demoScene');
      scene.addEventListener('loaded', ()=>{
        const pivot   = document.getElementById('pivot');      // solo Z (zoom)
        const rotator = document.getElementById('rotator');    // rotación 2 ejes
        const canvas  = scene.renderer.domElement;

        const st = {
          dragging:false, lastX:0, lastY:0,
          yaw:0, pitch:0, vy:0, vx:0,
          dist:0.9, min:0.35, max:5.0
        };

        (function tick(){
          if(Math.abs(st.vy)>0.0005){ st.yaw += st.vy; st.vy *= 0.95; } else { st.vy=0; }
          if(Math.abs(st.vx)>0.0005){ st.pitch += st.vx; st.vx *= 0.95; } else { st.vx=0; }
          st.pitch = clamp(st.pitch, -80, 80);
          rotator.setAttribute('rotation', {x:st.pitch, y:st.yaw, z:0});
          requestAnimationFrame(tick);
        })();

        const pd = e=>{ st.dragging=true; st.lastX=e.clientX; st.lastY=e.clientY; st.vx=0; st.vy=0; };
        const pu = ()=>{ st.dragging=false; };
        const pm = e=>{
          if(!st.dragging) return;
          const dx=e.clientX-st.lastX, dy=e.clientY-st.lastY;
          st.lastX=e.clientX; st.lastY=e.clientY;
          st.yaw   += dx*0.35;
          st.pitch -= dy*0.25;
          st.vy     = dx*0.035;
          st.vx     = -dy*0.025;
        };
        canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); pd(e); }, {passive:false});
        canvas.addEventListener('pointerup',   e=>{ e.preventDefault(); pu(e); }, {passive:false});
        canvas.addEventListener('pointerleave',e=>{ e.preventDefault(); pu(e); }, {passive:false});
        canvas.addEventListener('pointermove', e=>{ e.preventDefault(); pm(e); }, {passive:false});

        // Zoom rueda → mover pivot en Z
        canvas.addEventListener('wheel', e=>{
          e.preventDefault();
          st.dist = clamp(st.dist + Math.sign(e.deltaY)*0.12, st.min, st.max);
          pivot.setAttribute('position', `0 0 ${-st.dist}`);
        }, {passive:false});

        // Pinch-zoom
        let lastDist=0;
        canvas.addEventListener('touchmove', e=>{
          if(e.touches && e.touches.length===2){
            e.preventDefault();
            const [a,b]=e.touches, dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
            const d=Math.hypot(dx,dy);
            if(lastDist){
              const delta=(lastDist-d)/350;
              st.dist = clamp(st.dist + delta, st.min, st.max);
              pivot.setAttribute('position', `0 0 ${-st.dist}`);
            }
            lastDist=d;
          }
        }, {passive:false});
        canvas.addEventListener('touchend', ()=>{ lastDist=0; }, {passive:false});

        document.getElementById('covidModel')
          .addEventListener('loaded', ()=>log('✅ covid.glb cargado (DEMO)'));

        function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
        log('✅ Demo 3D listo (centrado, 2 ejes, zoom por distancia).');
      });
    }

    // ===== AR (MindAR) =====
    function startAR(){
      document.getElementById('screen').style.display='none';
      if(!isSecure){ log('❌ Sin HTTPS'); return; }
      if(!navigator.mediaDevices?.getUserMedia){ log('❌ Navegador sin cámara'); return; }

      const sceneHTML = `
        <a-scene id="arScene"
          mindar-image="imageTargetSrc: ./targets.mind;"
          renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:false"
          vr-mode-ui="enabled:false"
          device-orientation-permission-ui="enabled:true"
          embedded>
          <a-assets timeout="30000">
            <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
          </a-assets>

          <a-entity light="type: ambient; intensity: 1.0"></a-entity>
          <a-entity light="type: directional; intensity: 0.9" position="1 1 1"></a-entity>

          <!-- anchor (MindAR) → pivot (solo escala) → rotator (solo rotación) → model -->
          <a-entity id="anchor" mindar-image-target="targetIndex:0">
            <a-entity id="pivotAR" position="0 0 0" scale="1 1 1">
              <a-entity id="rotatorAR" rotation="0 0 0">
                <a-gltf-model id="mAR" src="#covidModel" center-model scale="0.9 0.9 0.9" position="0 0 0"></a-gltf-model>
              </a-entity>
            </a-entity>
          </a-entity>

          <a-camera position="0 0 0"></a-camera>
        </a-scene>
      `;
      document.body.insertAdjacentHTML('beforeend', sceneHTML);

      const scene = document.getElementById('arScene');
      scene.addEventListener('loaded', ()=> log('✅ Escena AR cargada'));
      scene.addEventListener('renderstart', ()=> log('🎥 Cámara activa'));
      setTimeout(()=>{
        const a=document.getElementById('anchor');
        if(a){ a.addEventListener('targetFound', ()=> log('🔵 target FOUND'));
               a.addEventListener('targetLost',  ()=> log('⚪ target LOST')); }
      }, 600);

      scene.addEventListener('loaded', ()=>{
        const pivot   = document.getElementById('pivotAR');    // escala
        const rotator = document.getElementById('rotatorAR');  // rotación 2 ejes
        const canvas  = scene.renderer.domElement;

        const st = {
          dragging:false, lastX:0, lastY:0,
          yaw:0, pitch:0, vy:0, vx:0,
          scale:1.0, min:0.4, max:2.0
        };

        (function tick(){
          if(Math.abs(st.vy)>0.0005){ st.yaw += st.vy; st.vy *= 0.95; } else { st.vy=0; }
          if(Math.abs(st.vx)>0.0005){ st.pitch += st.vx; st.vx *= 0.95; } else { st.vx=0; }
          st.pitch = clamp(st.pitch, -80, 80);
          rotator.setAttribute('rotation', {x:st.pitch, y:st.yaw, z:0});
          requestAnimationFrame(tick);
        })();

        const pd = e=>{ st.dragging=true; st.lastX=e.clientX; st.lastY=e.clientY; st.vx=0; st.vy=0; };
        const pu = ()=>{ st.dragging=false; };
        const pm = e=>{
          if(!st.dragging) return;
          const dx=e.clientX-st.lastX, dy=e.clientY-st.lastY;
          st.lastX=e.clientX; st.lastY=e.clientY;
          st.yaw   += dx*0.35;
          st.pitch -= dy*0.25;
          st.vy     = dx*0.035;
          st.vx     = -dy*0.025;
        };

        canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); pd(e); }, {passive:false});
        canvas.addEventListener('pointerup',   e=>{ e.preventDefault(); pu(e); }, {passive:false});
        canvas.addEventListener('pointerleave',e=>{ e.preventDefault(); pu(e); }, {passive:false});
        canvas.addEventListener('pointermove', e=>{ e.preventDefault(); pm(e); }, {passive:false});

        // Pinch-zoom: solo escala del pivot (anclado)
        let lastDist=0;
        canvas.addEventListener('touchmove', e=>{
          if(e.touches && e.touches.length===2){
            e.preventDefault();
            const [a,b]=e.touches, dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
            const d=Math.hypot(dx,dy);
            if(lastDist){
              const delta=(d-lastDist)/600;
              st.scale = clamp(st.scale + delta, st.min, st.max);
              pivot.setAttribute('scale', `${st.scale} ${st.scale} ${st.scale}`);
            }
            lastDist=d;
          }
        }, {passive:false});
        canvas.addEventListener('touchend', ()=>{ lastDist=0; }, {passive:false});

        document.getElementById('covidModel')
          .addEventListener('loaded', ()=>log('✅ covid.glb cargado (AR)'));
      });

      function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
    }

    // helpers / binding
    document.getElementById('btnDemo').addEventListener('click', startDemo);
    document.getElementById('btnAR').addEventListener('click', startAR);
  </script>
</body>
</html>
