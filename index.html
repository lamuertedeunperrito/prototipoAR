<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cardboard 360 con A‑Frame (Split SBS + Giroscopio)</title>
  <!-- Usa tu copia local si ya la tienes: <script src="./aframe.min.js"></script> -->
  <script "./aframe.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; }
    a-scene { width:100vw; height:100vh; }
    #ui { position: fixed; inset: auto 0 0 0; background: linear-gradient(transparent, rgba(0,0,0,.75)); padding: 10px 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; z-index: 10; }
    .row { display:flex; align-items:center; gap:6px; }
    input[type="range"] { width: 140px; }
    #status { position: fixed; right: 8px; bottom: 70px; background: rgba(0,0,0,.55); padding:6px 8px; border-radius:8px; font-size:12px; z-index: 10; }
    #file { appearance:none; background:#111; color:#fff; border:1px solid #333; border-radius:10px; padding:8px; }
    button { background:#0a84ff; border:none; color:#fff; padding:10px 12px; border-radius:10px; font-weight:600; }
    #fsBtn { background:#14b8a6; }
    #resetBtn { background:#f59e0b; }
    #gyroBtn { background:#7c3aed; }
  </style>
</head>
<body>
  <div id="status">Estado: <span id="st">cargando…</span></div>

  <!-- ESCENA A‑FRAME (sin WebXR; render estereoscópico manual con Three.js interno) -->
  <a-scene id="scene" renderer="antialias: true" vr-mode-ui="enabled: false">
    <a-assets id="assets" timeout="15000">
      <img id="pano" crossorigin="anonymous" />
    </a-assets>

    <!-- Rig + Cámara con look-controls (usa giroscopio en Android) -->
    <a-entity id="rig" cardboard-split="ipd: 0.064; fov: 80">
      <a-entity id="camera" camera="active: false; fov: 80" look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true" position="0 1.6 0"></a-entity>
    </a-entity>

    <!-- Cúpula 360; la textura se asigna al cargar imagen -->
    <a-sky id="sky" color="#222" radius="5000" material="shader: flat; side: back"></a-sky>
  </a-scene>

  <!-- UI -->
  <div id="ui">
    <input id="file" type="file" accept="image/*" />
    <button id="gyroBtn">🧭 Habilitar giroscopio</button>
    <button id="fsBtn">⤢ Pantalla completa</button>
    <button id="resetBtn">↺ Reset vista</button>
    <div class="row">
      <label>FOV</label>
      <input id="fov" type="range" min="40" max="110" step="1" value="80" />
      <span id="fovVal">80°</span>
    </div>
    <div class="row">
      <label>Yaw</label>
      <input id="yaw" type="range" min="-180" max="180" step="1" value="0" />
      <span id="yawVal">0°</span>
    </div>
  </div>

  <script>
    const st = (t)=>{ document.getElementById('st').textContent = t; console.log('[A‑Frame Split]', t); };

    // --- Componente: render estereoscópico SBS (sin WebXR) usando el renderer interno de A‑Frame ---
    AFRAME.registerComponent('cardboard-split', {
      schema: { ipd: {type:'number', default:0.064}, fov: {type:'number', default:80} },
      init: function(){
        const sceneEl = this.el.sceneEl;
        const renderer = sceneEl.renderer;
        const mainCamEl = document.querySelector('#camera');
        const rigEl = this.el; // el entity que tiene este componente

        // Deshabilitar XR para evitar rutas WebXR inconsistentes en Android
        renderer.xr.enabled = false;
        renderer.autoClear = false;
        renderer.setScissorTest(true);

        // Crea dos cámaras Three.js que usaremos manualmente
        const fov = this.data.fov;
        this.leftCam = new THREE.PerspectiveCamera(fov, 0.5, 0.01, 2000);
        this.rightCam = new THREE.PerspectiveCamera(fov, 0.5, 0.01, 2000);
        this.leftCam.matrixAutoUpdate = false;
        this.rightCam.matrixAutoUpdate = false;

        // Añadimos las cámaras al rig para que sigan la orientación
        rigEl.object3D.add(this.leftCam);
        rigEl.object3D.add(this.rightCam);

        // Loop de render manual: sustituimos el animation loop de A‑Frame
        const self = this;
        function renderLoop(){
          const w = renderer.domElement.width;
          const h = renderer.domElement.height;

          // Ajustes de FOV y aspecto (cada ojo = mitad de la pantalla)
          const f = self.data.fov;
          self.leftCam.fov = self.rightCam.fov = f;
          self.leftCam.aspect = self.rightCam.aspect = (0.5*w)/h;
          self.leftCam.updateProjectionMatrix();
          self.rightCam.updateProjectionMatrix();

          // Posición de ojos (IPD)
          const d = self.data.ipd * 0.5; // metros
          self.leftCam.position.set(-d, 0, 0);
          self.rightCam.position.set(d, 0, 0);

          // Copia la orientación de la cámara A‑Frame (controlada por look‑controls)
          const q = mainCamEl.object3D.getWorldQuaternion(new THREE.Quaternion());
          self.leftCam.quaternion.copy(q);
          self.rightCam.quaternion.copy(q);

          renderer.clear();
          // OJO IZQUIERDO
          renderer.setViewport(0, 0, w/2, h);
          renderer.setScissor(0, 0, w/2, h);
          renderer.render(sceneEl.object3D, self.leftCam);
          // OJO DERECHO
          renderer.setViewport(w/2, 0, w/2, h);
          renderer.setScissor(w/2, 0, w/2, h);
          renderer.render(sceneEl.object3D, self.rightCam);

          // Pide siguiente frame
          window.requestAnimationFrame(renderLoop);
        }
        window.requestAnimationFrame(renderLoop);
        st('split SBS activo');
      }
    });

    // --- Carga de imagen y utilidades ---
    const file = document.getElementById('file');
    const sky = document.getElementById('sky');
    const fovEl = document.getElementById('fov');
    const fovVal = document.getElementById('fovVal');
    const yawEl = document.getElementById('yaw');
    const yawVal = document.getElementById('yawVal');
    const rigEl = document.getElementById('rig');
    const camEl = document.getElementById('camera');

    file.addEventListener('change', ()=>{
      const img = file.files && file.files[0];
      if (!img) return;
      const url = URL.createObjectURL(img);
      const tmp = new Image();
      tmp.onload = ()=>{
        const ratio = tmp.width / tmp.height;
        if (Math.abs(ratio-2.0) > 0.1) st(`⚠️ no parece 2:1 (${tmp.width}×${tmp.height}), igual cargamos`);
        sky.setAttribute('src', url);
        st('textura 360 aplicada');
      };
      tmp.onerror = ()=> st('❌ no se pudo leer la imagen');
      tmp.src = url;
    });

    // FOV/Yaw
    function applyFov(){ fovVal.textContent = fovEl.value + '°'; rigEl.setAttribute('cardboard-split', `ipd: ${rigEl.getAttribute('cardboard-split').ipd}; fov: ${fovEl.value}`); }
    function applyYaw(){ yawVal.textContent = yawEl.value + '°'; rigEl.object3D.rotation.y = THREE.MathUtils.degToRad(parseInt(yawEl.value,10)); }
    fovEl.addEventListener('input', applyFov); applyFov();
    yawEl.addEventListener('input', applyYaw); applyYaw();

    // Giroscopio (Android suele permitir sin prompt; incluimos botón por compatibilidad)
    async function enableGyro(){
      try{
        const dom = window.DeviceMotionEvent; const doe = window.DeviceOrientationEvent;
        if (dom && typeof dom.requestPermission === 'function') { await dom.requestPermission(); }
        if (doe && typeof doe.requestPermission === 'function') { await doe.requestPermission(); }
        st('giroscopio habilitado');
        try{ await screen.orientation.lock('landscape'); }catch(_){ }
      }catch(e){ st('⚠️ no se pudo habilitar gyro: '+e.message); }
    }
    document.getElementById('gyroBtn').addEventListener('click', enableGyro);

    // Pantalla completa y reset
    document.getElementById('fsBtn').addEventListener('click', async ()=>{
      try{ if(!document.fullscreenElement){ await document.documentElement.requestFullscreen(); st('pantalla completa'); } else { await document.exitFullscreen(); st('salió de pantalla completa'); } }catch(e){ alert('No se pudo entrar a pantalla completa: '+e.message); }
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      rigEl.object3D.rotation.set(0,0,0); yawEl.value=0; yawVal.textContent='0°'; st('vista reiniciada');
      const lc = camEl.components['look-controls']; if (lc && lc.pitchObject && lc.yawObject){ lc.pitchObject.rotation.x=0; lc.yawObject.rotation.y=0; }
    });

    // Resize: A‑Frame maneja el canvas; nuestro loop toma el tamaño actual del renderer
    st('listo: carga imagen 2:1, pulsa Habilitar giroscopio y pantalla completa');
  </script>
</body>
</html>
