<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>AR + Demo 3D [Versión Corregida]</title>
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
    <style>
        :root { --bg:#0b0f13; --chip:#ffffff18; }
        html,body{margin:0;height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;touch-action:none}
        #screen{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--bg);color:#fff;padding:20px;text-align:center;z-index:100}
        .btn{padding:15px 20px;border-radius:12px;border:1px solid #ffffff26;background:var(--chip);color:#fff;font-weight:600;cursor:pointer;font-size:16px;min-width:200px}
        #log{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;color:#0ff;background:#001014cc;padding:8px 10px;border-radius:10px;font:11px/1.3 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:25vh;overflow:auto;pointer-events:none}
        #demoWrap{position:fixed;inset:0;background:#f5f5f5;display:none;z-index:50}
        a-scene{position:fixed;inset:0;width:100%;height:100%}
        .hint{opacity:.8;font-size:13px;max-width:90%}
        .back-btn{position:fixed;top:20px;left:20px;z-index:100;padding:10px 15px;background:#000000ee;color:#fff;border:1px solid #ffffff26;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600}
        .ar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);color:white;display:flex;justify-content:center;align-items:center;z-index:99;flex-direction:column;gap:20px}
        .ar-instructions{text-align:center;max-width:80%;font-size:18px}
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="screen">
        <div style="font-size:20px;opacity:.9;margin-bottom:10px">🔬 AR + Demo 3D</div>
        <div>
            <button class="btn" id="btnAR">📱 Iniciar AR</button>
            <button class="btn" id="btnDemo" style="margin-top:10px;">🎯 Iniciar Demo 3D</button>
        </div>
        <div class="hint">AR: Apunta a tu marcador | Demo: Arrastra para rotar, pellizca para zoom</div>
    </div>

    <div id="demoWrap"></div>
    <div id="log">Página cargada. Esperando acción...</div>

    <script>
        const logEl = document.getElementById('log');
        const log = m => {
            console.log(m);
            logEl.textContent = m + '\n' + logEl.textContent;
        };
        
        const isMobile = /Mobi|Android/i.test(navigator.userAgent);
        const isSecure = location.protocol.startsWith('https') || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        
        if(!isSecure) log('⚠️ Requiere HTTPS para la cámara (o localhost)');
        if(isMobile) log('📱 Dispositivo móvil detectado');
        
        // Componente para auto-ajustar el modelo - VERSIÓN CORREGIDA
        AFRAME.registerComponent('smart-model', {
            schema: {
                targetSize: {type: 'number', default: 1.0}
            },
            init() {
                this.el.addEventListener('model-loaded', () => {
                    // Pequeña demora para asegurar que el modelo esté completamente cargado
                    setTimeout(() => {
                        const obj = this.el.getObject3D('mesh');
                        if (!obj) {
                            log('❌ Error: No se pudo obtener el objeto 3D del modelo');
                            return;
                        }
                        
                        // Forzar la actualización de la matriz mundial
                        obj.updateMatrixWorld(true);
                        
                        // Calcular bounding box de forma más robusta
                        const box = new THREE.Box3();
                        
                        // Asegurarse de que el modelo tiene geometría
                        if (obj.children.length > 0) {
                            box.setFromObject(obj);
                        } else {
                            // Si no tiene hijos, intentar con el objeto mismo
                            if (obj.geometry) {
                                if (obj.geometry.boundingBox === null) {
                                    obj.geometry.computeBoundingBox();
                                }
                                box.copy(obj.geometry.boundingBox);
                                // Aplicar la matriz mundial para obtener la caja correcta
                                box.applyMatrix4(obj.matrixWorld);
                            } else {
                                log('⚠️ Modelo sin geometría detectable, usando valores por defecto');
                                // Establecer valores por defecto
                                obj.scale.set(0.5, 0.5, 0.5);
                                return;
                            }
                        }
                        
                        if (box.isEmpty()) {
                            log('⚠️ Bounding box vacío, usando escala por defecto');
                            obj.scale.set(0.5, 0.5, 0.5);
                            return;
                        }
                        
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        
                        // Validar que los valores sean números válidos
                        if (isNaN(size.x) || isNaN(size.y) || isNaN(size.z)) {
                            log('❌ Dimensiones del modelo no válidas, usando escala por defecto');
                            obj.scale.set(0.5, 0.5, 0.5);
                            return;
                        }
                        
                        const maxDimension = Math.max(size.x, size.y, size.z);
                        
                        // Centrar modelo
                        obj.position.x = -center.x;
                        obj.position.y = -center.y;
                        obj.position.z = -center.z;
                        
                        // Escalar para que quepa bien en pantalla
                        const scale = this.data.targetSize / maxDimension;
                        obj.scale.set(scale, scale, scale);
                        
                        obj.traverse(node => {
                            if (node.isMesh) {
                                node.frustumCulled = false;
                                if (node.material) {
                                    node.material.needsUpdate = true;
                                }
                            }
                        });
                        
                        log(`✅ Modelo ajustado: ${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)} (escala: ${scale.toFixed(2)})`);
                    }, 100);
                });
                
                this.el.addEventListener('model-error', e => {
                    log(`❌ Error cargando modelo: ${e.detail ? e.detail.src : 'Origen desconocido'}`);
                });
            }
        });
        
        // Función para añadir botón de regreso
        function addBackButton(onBack) {
            const btn = document.createElement('button');
            btn.className = 'back-btn';
            btn.innerHTML = '← Volver';
            btn.onclick = () => {
                onBack();
                btn.remove();
                document.getElementById('screen').style.display = 'grid';
            };
            document.body.appendChild(btn);
            return btn;
        }
        
        // --- DEMO 3D ESTABLE ---
        function startDemo(){
            document.getElementById('screen').style.display = 'none';
            log('Iniciando Demo 3D...');
            
            const wrap = document.getElementById('demoWrap');
            wrap.style.display='block';
            wrap.innerHTML = `
                <a-scene id="demoScene" background="color: #EFEFEF" 
                    renderer="colorManagement: true; physicallyCorrectLights: true;">
                    <a-assets timeout="30000">
                        <a-asset-item id="model-asset" src="./covid.glb"></a-asset-item>
                    </a-assets>
                    
                    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
                    <a-entity light="type: directional; intensity: 1.0" position="2 2 1"></a-entity>
                    
                    <a-camera position="0 1.6 3" look-controls="enabled: false"></a-camera>
                    
                    <a-entity id="pivot" position="0 0 -3">
                        <a-gltf-model src="#model-asset" smart-model="targetSize: 1.5"></a-gltf-model>
                    </a-entity>
                </a-scene>
            `;
            
            const scene = document.getElementById('demoScene');
            scene.addEventListener('loaded', () => {
                const pivot = document.getElementById('pivot');
                const camera = document.querySelector('#demoScene a-camera');
                const canvas = scene.canvas;
                
                const state = {
                    isDragging: false,
                    lastX: 0,
                    lastY: 0,
                    lastTouchDist: 0
                };
                
                const sensitivity = 0.5;
                const minZoom = 1.5, maxZoom = 8.0;
                
                const onPointerDown = e => {
                    state.isDragging = true;
                    const pos = e.touches ? e.touches[0] : e;
                    state.lastX = pos.clientX;
                    state.lastY = pos.clientY;
                };
                
                const onPointerUp = () => {
                    state.isDragging = false;
                };
                
                const onPointerMove = e => {
                    if (!state.isDragging) return;
                    
                    const pos = e.touches ? e.touches[0] : e;
                    const deltaX = pos.clientX - state.lastX;
                    const deltaY = pos.clientY - state.lastY;
                    
                    const currentRotation = pivot.getAttribute('rotation');
                    pivot.setAttribute('rotation', {
                        x: currentRotation.x - deltaY * sensitivity,
                        y: currentRotation.y + deltaX * sensitivity,
                        z: 0
                    });
                    
                    state.lastX = pos.clientX;
                    state.lastY = pos.clientY;
                };
                
                const handleZoom = (delta) => {
                    let newZ = parseFloat(pivot.getAttribute('position').z) - delta;
                    newZ = Math.max(-maxZoom, Math.min(-minZoom, newZ));
                    pivot.setAttribute('position', `0 0 ${newZ}`);
                };
                
                // Eventos de Mouse
                canvas.addEventListener('mousedown', onPointerDown);
                canvas.addEventListener('mouseup', onPointerUp);
                canvas.addEventListener('mouseleave', onPointerUp);
                canvas.addEventListener('mousemove', onPointerMove);
                canvas.addEventListener('wheel', e => handleZoom(e.deltaY * 0.01));
                
                // Eventos Táctiles
                canvas.addEventListener('touchstart', e => {
                    if (e.touches.length === 1) onPointerDown(e);
                    if (e.touches.length === 2) {
                        state.lastTouchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    }
                });
                
                canvas.addEventListener('touchend', onPointerUp);
                canvas.addEventListener('touchmove', e => {
                    if (e.touches.length === 1) onPointerMove(e);
                    if (e.touches.length === 2) {
                        const newDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                        handleZoom((state.lastTouchDist - newDist) * 0.02);
                        state.lastTouchDist = newDist;
                    }
                });
                
                log('✅ Demo 3D listo.');
            });
            
            addBackButton(() => {
                wrap.style.display = 'none';
                wrap.innerHTML = '';
            });
        }
        
        // --- AR CORREGIDO ---
        function startAR(){
            document.getElementById('screen').style.display = 'none';
            log('Iniciando AR...');
            
            // Crear overlay de instrucciones
            const overlay = document.createElement('div');
            overlay.className = 'ar-overlay';
            overlay.innerHTML = `
                <div class="ar-instructions">
                    <h2>Modo AR Activado</h2>
                    <p>Permite el acceso a la cámara cuando se solicite</p>
                    <p>Apunta hacia tu marcador impreso</p>
                </div>
                <div class="loading-spinner"></div>
            `;
            document.body.appendChild(overlay);
            
            // Crear la escena AR
            const sceneEl = document.createElement('a-scene');
            sceneEl.setAttribute('mindar-image', 'imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no; uiLoading: no; uiError: no;');
            sceneEl.setAttribute('renderer', 'colorManagement: true; alpha: true;');
            sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
            sceneEl.setAttribute('device-orientation-permission-ui', 'enabled: false');
            sceneEl.setAttribute('embedded', '');
            
            sceneEl.innerHTML = `
                <a-assets timeout="60000">
                    <a-asset-item id="ar-model-asset" src="./covid.glb"></a-asset-item>
                </a-assets>
                
                <a-camera position="0 0 0" active="true" look-controls="enabled: false"></a-camera>
                
                <a-entity light="type: ambient; color: #FFF; intensity: 0.6"></a-entity>
                <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="1 1 0"></a-entity>
                
                <a-entity mindar-image-target="targetIndex: 0">
                    <a-gltf-model src="#ar-model-asset" smart-model="targetSize: 0.8" 
                                position="0 0 0" rotation="0 0 0" scale="1 1 1" visible="true">
                    </a-gltf-model>
                </a-entity>
            `;
            
            document.body.appendChild(sceneEl);
            
            // Eventos de la escena AR
            sceneEl.addEventListener('loaded', function() {
                log('✅ Escena AR cargada correctamente.');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 2000);
            });
            
            sceneEl.addEventListener('renderstart', function() {
                log('✅ Renderizado AR iniciado. Cámara activa.');
            });
            
            // Manejar eventos de target found/lost
            sceneEl.addEventListener('targetFound', event => {
                log('🎯 ¡Marcador encontrado!');
            });
            
            sceneEl.addEventListener('targetLost', event => {
                log('Marcador perdido.');
            });
            
            // Manejar posibles errores
            sceneEl.addEventListener('error', (e) => {
                log('❌ Error en la escena AR: ' + (e.detail ? e.detail.message : 'Error desconocido'));
                overlay.innerHTML = '<div class="ar-instructions"><h2>Error al cargar AR</h2><p>Verifica la consola para más detalles</p></div>';
            });
            
            // Botón para volver
            const backBtn = addBackButton(() => {
                try {
                    const mindarSystem = sceneEl.systems['mindar-image-system'];
                    if (mindarSystem) {
                        mindarSystem.stop();
                        log('Sistema AR detenido.');
                    }
                } catch (e) {
                    console.error('Error al detener MindAR:', e);
                }
                
                sceneEl.parentNode.removeChild(sceneEl);
                if (overlay.parentNode) {
                    overlay.parentNode.removeChild(overlay);
                }
            });
        }
        
        // Asignar eventos a los botones
        document.getElementById('btnDemo').addEventListener('click', startDemo);
        document.getElementById('btnAR').addEventListener('click', startAR);
    </script>
</body>
</html>
