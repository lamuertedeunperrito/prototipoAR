<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR (MindAR) + Demo 3D — Mobile Fixed</title>

  <!-- Librerías locales en la RAÍZ -->
  <script src="./aframe.min.js?v=4"></script>
  <script src="./mindar-image-aframe.prod.js?v=4"></script>

  <style>
    :root { --bg:#0b0f13; --chip:#ffffff18; }
    html,body{margin:0;height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
    #screen{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--bg);color:#fff;padding:20px;text-align:center}
    .btn{padding:15px 20px;border-radius:12px;border:1px solid #ffffff26;background:var(--chip);color:#fff;font-weight:600;cursor:pointer;font-size:16px;min-width:200px}
    .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    #log{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;color:#0ff;background:#001014cc;padding:8px 10px;border-radius:10px;font:11px/1.3 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:25vh;overflow:auto}
    #demoWrap{position:fixed;inset:0;background:#f5f5f5;display:none}
    a-scene{position:fixed;inset:0;width:100%;height:100%}
    .hint{opacity:.8;font-size:13px;max-width:90%}
    .back-btn{position:fixed;top:20px;left:20px;z-index:100;padding:10px 15px;background:#000000ee;color:#fff;border:1px solid #ffffff26;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600}
  </style>
</head>
<body>
  <div id="screen">
    <div style="font-size:20px;opacity:.9;margin-bottom:10px">🔬 AR + Demo 3D</div>
    <div class="row">
      <button class="btn" id="btnAR">📱 AR con Marcador</button>
      <button class="btn" id="btnDemo">🎯 Demo 3D</button>
    </div>
    <div class="hint">AR: Apunta al marcador impreso • Demo: arrastra (2 ejes) y pincha/rueda para zoom</div>
  </div>

  <div id="demoWrap"></div>
  <div id="log"></div>

  <script>
    // ---------- Utilidades ----------
    const logEl = document.getElementById('log');
    const log = m => { console.log(m); logEl.textContent += (logEl.textContent?'\n':'') + m; logEl.scrollTop = logEl.scrollHeight; };
    const isMobile = /Mobi|Android/i.test(navigator.userAgent);
    const isSecure = location.protocol.startsWith('https') || location.hostname === 'localhost';
    if(!isSecure) log('⚠️ Requiere HTTPS para cámara');
    if(!window.AFRAME) log('❌ A-Frame NO cargó');

    // Componente: centra el modelo y desactiva frustum culling
    AFRAME.registerComponent('smart-model', {
      schema: { targetSize: {type: 'number', default: 1.0} },
      init(){
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if(!obj){ log('⚠️ No se pudo obtener el mesh del modelo'); return; }
          const box = new THREE.Box3().setFromObject(obj);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z) || 1.0;

          // centrar en origen
          obj.position.sub(center);

          // escalar para que "quepa" (unidad = metros aprox. en A-Frame)
          const scale = this.data.targetSize / maxDim;
          obj.scale.setScalar(scale);

          // render tweaks
          obj.traverse(n=>{
            if(n.isMesh){
              n.frustumCulled = false;
              n.castShadow = true;
              n.receiveShadow = true;
              if(n.material) n.material.needsUpdate = true;
            }
          });
          obj.updateMatrixWorld(true);

          log(`✅ smart-model: size ${size.x.toFixed(2)}×${size.y.toFixed(2)}×${size.z.toFixed(2)} → scale ${scale.toFixed(2)}`);
        });
      }
    });

    const clamp = (v,min,max)=>Math.min(max,Math.max(min,v));

    const addBackButton = (cb)=>{
      const btn = document.createElement('button');
      btn.className = 'back-btn';
      btn.textContent = '← Menú';
      btn.onclick = cb;
      document.body.appendChild(btn);
      return btn;
    };

    // ===== DEMO 3D =====
    function startDemo(){
      document.getElementById('screen').style.display='none';
      const wrap = document.getElementById('demoWrap');
      wrap.style.display='block';

      wrap.innerHTML = `
        <a-scene id="demoScene" background="color: #ffffff"
                 renderer="colorManagement:true; antialias:${isMobile?'false':'true'}; precision:${isMobile?'mediump':'highp'}"
                 vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
          <a-assets timeout="30000">
            <a-asset-item id="covidModel" src="./covid.glb?v=4"></a-asset-item>
          </a-assets>

          <a-entity light="type: ambient; intensity: 0.9"></a-entity>
          <a-entity light="type: directional; intensity: 1.0" position="1 2 1"></a-entity>

          <!-- Estructura: pivot (distancia) -> rotator (rotación 2-ejes) -> model -->
          <a-entity id="pivot" position="0 0 -1.6">
            <a-entity id="rotator" rotation="0 0 0">
              <a-gltf-model id="model3d" src="#covidModel" smart-model="targetSize: 1.2" position="0 0 0"></a-gltf-model>
            </a-entity>
          </a-entity>

          <a-entity camera="near:0.01; far:100" position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-entity>
        </a-scene>
      `;

      const backBtn = addBackButton(()=>{
        wrap.style.display='none';
        document.getElementById('screen').style.display='grid';
        backBtn.remove();
      });

      const scene = document.getElementById('demoScene');
      scene.addEventListener('loaded', ()=>{
        const pivot = document.getElementById('pivot');
        const rotator = document.getElementById('rotator');
        const canvas = scene.renderer.domElement;

        const st = {
          dragging:false, lastX:0, lastY:0,
          yaw:0, pitch:0, vy:0, vx:0,
          dist:1.6, min:0.6, max:5.0,
          sensYaw:0.35, sensPitch:0.25
        };

        // inercia + límites pitch
        (function tick(){
          if(Math.abs(st.vy)>0.0005){ st.yaw += st.vy; st.vy *= 0.95; } else { st.vy=0; }
          if(Math.abs(st.vx)>0.0005){ st.pitch += st.vx; st.vx *= 0.95; } else { st.vx=0; }
          st.pitch = clamp(st.pitch, -80, 80);
          rotator.setAttribute('rotation', {x:st.pitch, y:st.yaw, z:0});
          requestAnimationFrame(tick);
        })();

        const pd = e=>{ st.dragging=true; st.lastX=e.clientX; st.lastY=e.clientY; st.vx=0; st.vy=0; };
        const pu = ()=>{ st.dragging=false; };
        const pm = e=>{
          if(!st.dragging) return;
          const dx=e.clientX-st.lastX, dy=e.clientY-st.lastY;
          st.lastX=e.clientX; st.lastY=e.clientY;
          st.yaw   += dx*st.sensYaw;
          st.pitch -= dy*st.sensPitch;
          st.vy     = dx*(st.sensYaw*0.1);
          st.vx     = -dy*(st.sensPitch*0.1);
        };

        canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); pd(e); }, {passive:false});
        canvas.addEventListener('pointerup',   e=>{ e.preventDefault(); pu(e); }, {passive:false});
        canvas.addEventListener('pointerleave',e=>{ e.preventDefault(); pu(e); }, {passive:false});
        canvas.addEventListener('pointermove', e=>{ e.preventDefault(); pm(e); }, {passive:false});

        // rueda -> acercar/alejar (mueve pivot en Z)
        canvas.addEventListener('wheel', e=>{
          e.preventDefault();
          st.dist = clamp(st.dist + Math.sign(e.deltaY)*0.12, st.min, st.max);
          pivot.setAttribute('position', `0 0 ${-st.dist}`);
        }, {passive:false});

        // pinch-zoom
        let lastDist=0;
        canvas.addEventListener('touchmove', e=>{
          if(e.touches && e.touches.length===2){
            e.preventDefault();
            const [a,b]=e.touches, dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
            const d=Math.hypot(dx,dy);
            if(lastDist){
              const delta=(lastDist-d)/350;
              st.dist = clamp(st.dist + delta, st.min, st.max);
              pivot.setAttribute('position', `0 0 ${-st.dist}`);
            }
            lastDist=d;
          }
        }, {passive:false});
        canvas.addEventListener('touchend', ()=>{ lastDist=0; }, {passive:false});

        document.getElementById('covidModel').addEventListener('loaded', ()=>log('✅ Modelo DEMO cargado'));
      });
    }

    // ===== AR (MindAR) =====
    function startAR(){
      document.getElementById('screen').style.display='none';
      if(!isSecure){ log('❌ Requiere HTTPS'); setTimeout(()=>document.getElementById('screen').style.display='grid',1500); return; }

      const sceneHTML = `
        <a-scene id="arScene"
          mindar-image="imageTargetSrc: ./targets.mind; maxTrack:1; filterMinCF:0.0005; filterBeta:0.001"
          renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:false; precision:${isMobile?'mediump':'highp'}"
          vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded>
          <a-assets timeout="30000">
            <a-asset-item id="covidModelAR" src="./covid.glb?v=4"></a-asset-item>
          </a-assets>

          <a-entity light="type: ambient; intensity: 0.9"></a-entity>
          <a-entity light="type: directional; intensity: 1.1" position="1 1 1"></a-entity>

          <!-- anchor (MindAR) → pivotAR (escala/zoom) → rotatorAR (rotación 2-ejes) → model -->
          <a-entity id="anchor" mindar-image-target="targetIndex:0">
            <a-entity id="pivotAR" position="0 0 0" scale="1 1 1">
              <a-entity id="rotatorAR" rotation="0 0 0">
                <a-gltf-model id="arModel" src="#covidModelAR" smart-model="targetSize: 0.9" position="0 0 0" visible="false"></a-gltf-model>
              </a-entity>
            </a-entity>
          </a-entity>

          <a-camera position="0 0 0"></a-camera>
        </a-scene>
      `;
      document.body.insertAdjacentHTML('beforeend', sceneHTML);

      const backBtn = addBackButton(()=>{
        const s = document.getElementById('arScene'); if(s) s.remove();
        document.getElementById('screen').style.display='grid';
        backBtn.remove();
      });

      const scene = document.getElementById('arScene');
      scene.addEventListener('loaded', ()=> log('✅ AR listo — apunta al marcador'));
      scene.addEventListener('renderstart', ()=> log('📹 Cámara AR activa'));

      // Mostrar/ocultar modelo al detectar el target
      setTimeout(()=>{
        const anchor = document.getElementById('anchor');
        const model  = document.getElementById('arModel');
        if(anchor && model){
          anchor.addEventListener('targetFound', ()=>{
            log('🎯 Marcador encontrado');
            model.setAttribute('visible','true');
            // pequeño “pop” para confirmar
            model.setAttribute('animation__pop','property: scale; to: 1.05 1.05 1.05; dur: 300; dir: alternate; loop: 1; easing: easeOutQuad');
          });
          anchor.addEventListener('targetLost', ()=>{
            log('⚪ Marcador perdido');
            model.setAttribute('visible','false');
          });
        }
      }, 600);

      // Gestos en AR: rotamos rotatorAR y escalamos pivotAR (el anclaje no se toca)
      scene.addEventListener('loaded', ()=>{
        const pivot   = document.getElementById('pivotAR');    // escala (zoom)
        const rotator = document.getElementById('rotatorAR');  // rotación 2-ejes
        const canvas  = scene.renderer.domElement;
        const st = {
          dragging:false, lastX:0, lastY:0,
          yaw:0, pitch:0, vy:0, vx:0,
          scale:1.0, min:0.4, max:2.0,
          sensYaw:0.35, sensPitch:0.25
        };

        (function tick(){
          if(Math.abs(st.vy)>0.0005){ st.yaw += st.vy; st.vy *= 0.95; } else { st.vy=0; }
          if(Math.abs(st.vx)>0.0005){ st.pitch += st.vx; st.vx *= 0.95; } else { st.vx=0; }
          st.pitch = clamp(st.pitch, -80, 80);
          rotator.setAttribute('rotation', {x:st.pitch, y:st.yaw, z:0});
          requestAnimationFrame(tick);
        })();

        const pd = e=>{ st.dragging=true; st.lastX=e.clientX; st.lastY=e.clientY; st.vx=0; st.vy=0; };
        const pu = ()=>{ st.dragging=false; };
        const pm = e=>{
          if(!st.dragging) return;
          const dx=e.clientX-st.lastX, dy=e.clientY-st.lastY;
          st.lastX=e.clientX; st.lastY=e.clientY;
          st.yaw   += dx*st.sensYaw;
          st.pitch -= dy*st.sensPitch;
          st.vy     = dx*(st.sensYaw*0.1);
          st.vx     = -dy*(st.sensPitch*0.1);
        };

        canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); pd(e); }, {passive:false});
        canvas.addEventListener('pointerup',   e=>{ e.preventDefault(); pu(e); }, {passive:false});
        canvas.addEventListener('pointerleave',e=>{ e.preventDefault(); pu(e); }, {passive:false});
        canvas.addEventListener('pointermove', e=>{ e.preventDefault(); pm(e); }, {passive:false});

        // pinch-zoom → escala del pivot (sin mover el ancla)
        let lastDist=0;
        canvas.addEventListener('touchmove', e=>{
          if(e.touches && e.touches.length===2){
            e.preventDefault();
            const [a,b]=e.touches, dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
            const d=Math.hypot(dx,dy);
            if(lastDist){
              const delta=(d-lastDist)/600;
              st.scale = clamp(st.scale + delta, st.min, st.max);
              pivot.setAttribute('scale', `${st.scale} ${st.scale} ${st.scale}`);
            }
            lastDist=d;
          }
        }, {passive:false});
        canvas.addEventListener('touchend', ()=>{ lastDist=0; }, {passive:false});

        // rueda (desktop) → escala igual
        canvas.addEventListener('wheel', e=>{
          e.preventDefault();
          st.scale = clamp(st.scale + (Math.sign(e.deltaY)*-0.05), st.min, st.max);
          pivot.setAttribute('scale', `${st.scale} ${st.scale} ${st.scale}`);
        }, {passive:false});

        document.getElementById('covidModelAR').addEventListener('loaded', ()=>log('✅ Modelo AR cargado'));
        document.getElementById('covidModelAR').addEventListener('error', ()=>log('❌ Error cargando covid.glb (AR)'));
      });
    }

    // Eventos UI
    document.getElementById('btnDemo').addEventListener('click', startDemo);
    document.getElementById('btnAR').addEventListener('click', startAR);

    // Recordatorio de archivos
    setTimeout(()=>{ log('📁 Necesarios: aframe.min.js, mindar-image-aframe.prod.js, targets.mind, covid.glb'); }, 800);
  </script>
</body>
</html>
