<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>WebAR con MindAR – Image Tracking</title>
    
    <!-- CARGA SÍNCRONA: A-Frame primero -->
    <script src="https://unpkg.com/aframe@1.4.0/dist/aframe.min.js"></script>
    <!-- ESPERA un momento y luego MindAR -->
    <script>
        // Función para cargar MindAR solo cuando A-Frame esté 100% listo
        function loadMindARSafely() {
            if (typeof AFRAME !== 'undefined' && AFRAME.registerComponent) {
                console.log('✅ A-Frame confirmado, cargando MindAR...');
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js';
                script.onload = () => {
                    console.log('✅ MindAR cargado, inicializando AR...');
                    window.mindARReady = true;
                };
                script.onerror = () => {
                    console.error('❌ Error cargando MindAR');
                    // Fallback
                    const fallbackScript = document.createElement('script');
                    fallbackScript.src = 'https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js';
                    fallbackScript.onload = () => {
                        console.log('✅ MindAR cargado (fallback)');
                        window.mindARReady = true;
                    };
                    document.head.appendChild(fallbackScript);
                };
                document.head.appendChild(script);
            } else {
                console.log('⏳ Esperando A-Frame...');
                setTimeout(loadMindARSafely, 100);
            }
        }
        
        // Iniciar carga después de que el script actual termine
        setTimeout(loadMindARSafely, 100);
    </script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        #ui {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        
        #ui .chip {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
        
        #help {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            line-height: 1.4;
            backdrop-filter: blur(10px);
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        a-scene {
            width: 100vw;
            height: 100vh;
        }
        
        .a-enter-vr {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Inicializando AR...</div>
    </div>
    
    <div id="ui" style="display: none;">
        <div class="chip">📷 Apunta al marcador impreso</div>
        <div class="chip">🔄 Toca y arrastra para rotar</div>
    </div>
    
    <!-- Escena AR estática - se mostrará cuando todo esté listo -->
    <a-scene
        id="arScene"
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; warmupTolerance: 5; missTolerance: 5"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        loading-screen="enabled: false"
        embedded
        style="display: none;"
    >
        <a-assets>
            <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" intensity="0.8"></a-light>
        <a-light type="directional" position="2 4 5" intensity="0.5"></a-light>

        <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                id="model3d"
                src="#covidModel" 
                position="0 0 0" 
                rotation="0 0 0" 
                scale="0.3 0.3 0.3"
                animation-mixer
            >
            </a-gltf-model>
        </a-entity>

        <a-camera 
            position="0 0 0"
            look-controls="enabled: false"
            cursor="rayOrigin: mouse"
        ></a-camera>
    </a-scene>
    
    <div id="help" style="display: none;">
        <strong>💡 Consejos:</strong><br>
        • Usa Chrome o Safari nativo (no Instagram/Facebook)<br>
        • Asegúrate de estar en HTTPS<br>
        • Permite acceso a la cámara<br>
        • Mantén buena iluminación y estabilidad
    </div>

    <script>
        let arScene;
        let isInitialized = false;
        
        // Verificar compatibilidad
        function checkCompatibility() {
            const isHTTPS = location.protocol === 'https:' || location.hostname === 'localhost';
            const hasUserMedia = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
            
            if (!isHTTPS) {
                showError('Se requiere HTTPS para acceder a la cámara');
                return false;
            }
            
            if (!hasUserMedia) {
                showError('Tu navegador no soporta acceso a cámara');
                return false;
            }
            
            return true;
        }

        function updateLoadingText(text) {
            const loadingText = document.getElementById('loadingText');
            if (loadingText) {
                loadingText.textContent = text;
            }
            console.log(text);
        }

        function waitForMindAR() {
            if (window.mindARReady && !isInitialized) {
                console.log('🚀 MindAR listo, inicializando AR...');
                isInitialized = true;
                initializeAR();
            } else if (!isInitialized) {
                console.log('⏳ Esperando MindAR...');
                setTimeout(waitForMindAR, 200);
            }
        }

        function initializeAR() {
            console.log('🎯 Inicializando escena AR...');
            updateLoadingText('Iniciando cámara...');
            
            arScene = document.querySelector('#arScene');
            
            if (!arScene) {
                showError('Error: No se encontró la escena AR');
                return;
            }

            // Configurar eventos
            arScene.addEventListener('renderstart', function() {
                console.log('✅ MindAR renderstart - Cámara iniciada');
                setTimeout(() => {
                    hideLoading();
                    showUI();
                }, 500);
            });

            // Eventos de detección
            const targetEntity = document.querySelector('#targetEntity');
            if (targetEntity) {
                targetEntity.addEventListener('targetFound', function() {
                    console.log('🎯 Target encontrado!');
                    const model = document.querySelector('#model3d');
                    if (model) {
                        // Animación suave al detectar
                        model.setAttribute('animation__appear', {
                            property: 'scale',
                            from: '0.1 0.1 0.1',
                            to: '0.3 0.3 0.3',
                            dur: 600,
                            easing: 'easeOutBack'
                        });
                        
                        // Rotación continua
                        model.setAttribute('animation__rotate', {
                            property: 'rotation',
                            to: '0 360 0',
                            loop: true,
                            dur: 8000
                        });
                    }
                });

                targetEntity.addEventListener('targetLost', function() {
                    console.log('❌ Target perdido');
                    const model = document.querySelector('#model3d');
                    if (model) {
                        model.removeAttribute('animation__rotate');
                    }
                });
            }

            // Mostrar escena
            arScene.style.display = 'block';
            
            // Timeout de seguridad para mostrar UI
            setTimeout(() => {
                if (document.getElementById('loading').style.display !== 'none') {
                    console.log('⏰ Timeout alcanzado, mostrando UI...');
                    hideLoading();
                    showUI();
                }
            }, 10000);
        }

        function hideLoading() {
            const loading = document.querySelector('#loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }

        function showUI() {
            const ui = document.querySelector('#ui');
            const help = document.querySelector('#help');
            
            if (ui) ui.style.display = 'flex';
            if (help) help.style.display = 'block';
        }

        function showError(message) {
            const loading = document.querySelector('#loading');
            if (loading) {
                loading.innerHTML = `
                    <div style="color: #ff6b6b; font-size: 16px; margin-bottom: 8px;">❌ Error</div>
                    <div style="font-size: 12px; margin-bottom: 12px;">${message}</div>
                    <div style="font-size: 10px; opacity: 0.7;">
                        Verifica: HTTPS, Chrome/Safari nativo, permisos de cámara
                    </div>
                `;
            }
            console.error('Error:', message);
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 DOM cargado');
            
            if (!checkCompatibility()) {
                return;
            }

            updateLoadingText('Cargando librerías AR...');
            
            // Verificar que A-Frame esté disponible
            if (typeof AFRAME === 'undefined') {
                showError('A-Frame no se cargó correctamente');
                return;
            }
            
            console.log('✅ A-Frame disponible');
            
            // Esperar a MindAR
            waitForMindAR();
        });

        // Manejo de errores globales
        window.addEventListener('error', function(e) {
            console.error('❌ Error global:', e.error);
        });

        // Debug: Verificar archivos
        function checkFiles() {
            const files = ['./targets.mind', './covid.glb'];
            files.forEach(file => {
                fetch(file, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            console.log(`✅ ${file} existe`);
                        } else {
                            console.error(`❌ ${file} no encontrado (${response.status})`);
                        }
                    })
                    .catch(err => {
                        console.error(`❌ Error verificando ${file}:`, err);
                    });
            });
        }

        // Verificar archivos después de 1 segundo
        setTimeout(checkFiles, 1000);
    </script>
</body>
</html>
