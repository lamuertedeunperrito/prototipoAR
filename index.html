<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Visor 360° para Cardboard (Foto Equirectangular)</title>
  <!-- A-Frame (maneja VR/WebXR y split para Cardboard) -->
  <script src="https://unpkg.com/aframe@1.5.0/dist/aframe.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; }
    #ui { position: fixed; inset: auto 0 0 0; background: linear-gradient(transparent, rgba(0,0,0,.75)); padding: 10px 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; z-index: 10; }
    .row { display:flex; align-items:center; gap:6px; }
    input[type="range"] { width: 140px; }
    #msg { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 10px; font-size: 12px; z-index: 10; }
    #enterVRBtn, #fsBtn, #resetBtn { background:#0a84ff; border:none; color:#fff; padding:10px 12px; border-radius:10px; font-weight:600; }
    #fsBtn { background:#14b8a6; }
    #resetBtn { background:#f59e0b; }
    #file { appearance:none; background:#111; color:#fff; border:1px solid #333; border-radius:10px; padding:8px; }
    a-scene { width:100vw; height:100vh; }
  </style>
</head>
<body>
  <div id="msg">Carga una foto 360° equirectangular (2:1) y pulsa “Entrar en VR”. Bloquea la orientación en horizontal antes de meter el celu en el visor.</div>

  <!-- Escena VR -->
  <a-scene vr-mode-ui="enterVRButton: #enterVRBtn" device-orientation-permission-ui="enabled: true">
    <!-- Cámara con controles de mirada (giroscopio en móvil) -->
    <a-entity id="rig">
      <a-entity id="camera" camera="fov: 80" look-controls position="0 1.6 0"></a-entity>
    </a-entity>

    <!-- Cúpula 360: la imagen se coloca por dentro (side: back) -->
    <a-sky id="sky" color="#000" rotation="0 -90 0" material="shader: flat; side: back;"></a-sky>
  </a-scene>

  <!-- UI -->
  <div id="ui">
    <input id="file" type="file" accept="image/*" />
    <button id="enterVRBtn">🎬 Entrar en VR</button>
    <button id="fsBtn">⤢ Pantalla completa</button>
    <button id="resetBtn">↺ Reset vista</button>
    <div class="row">
      <label>FOV</label>
      <input id="fov" type="range" min="40" max="110" step="1" value="80" />
      <span id="fovVal">80°</span>
    </div>
    <div class="row">
      <label>Giro Y</label>
      <input id="yaw" type="range" min="-180" max="180" step="1" value="0" />
      <span id="yawVal">0°</span>
    </div>
  </div>

  <script>
    const file = document.getElementById('file');
    const sky  = document.getElementById('sky');
    const cameraEl = document.getElementById('camera');
    const rigEl = document.getElementById('rig');
    const fov = document.getElementById('fov');
    const fovVal = document.getElementById('fovVal');
    const yaw = document.getElementById('yaw');
    const yawVal = document.getElementById('yawVal');
    const fsBtn = document.getElementById('fsBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Cargar imagen seleccionada por el usuario
    file.addEventListener('change', () => {
      const img = file.files && file.files[0];
      if (!img) return;
      const url = URL.createObjectURL(img);
      sky.setAttribute('src', url);
      // A-Frame ajusta automáticamente; garantizamos que sea visto por dentro
      sky.setAttribute('material', 'shader: flat; side: back');
    });

    // FOV
    function applyFov() {
      const v = parseInt(fov.value, 10);
      fovVal.textContent = v + '°';
      cameraEl.setAttribute('camera', 'fov', v);
    }
    fov.addEventListener('input', applyFov);
    applyFov();

    // Yaw (giro inicial)
    function applyYaw(){
      const v = parseInt(yaw.value, 10);
      yawVal.textContent = v + '°';
      // Rotamos el rig en Y para re-encuadrar el horizonte
      rigEl.setAttribute('rotation', `0 ${v} 0`);
    }
    yaw.addEventListener('input', applyYaw);
    applyYaw();

    // Reset vista (resetea rig y look-controls)
    resetBtn.addEventListener('click', () => {
      rigEl.setAttribute('rotation', '0 0 0');
      yaw.value = 0; yawVal.textContent = '0°';
      const lc = cameraEl.components['look-controls'];
      if (lc && lc.pitchObject && lc.yawObject) {
        lc.pitchObject.rotation.x = 0;
        lc.yawObject.rotation.y = 0;
      }
    });

    // Pantalla completa
    fsBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) { alert('Pantalla completa no disponible: ' + e.message); }
    });

    // Tip UX: esconder mensaje inicial
    setTimeout(() => { const m = document.getElementById('msg'); m && (m.style.display='none'); }, 5000);
  </script>
</body>
</html>
