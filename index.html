<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR (MindAR) + Demo 3D — Corregido</title>

  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>

  <style>
    :root { --bg:#0b0f13; --chip:#ffffff18; }
    html,body{margin:0;height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;touch-action:none}
    #screen{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--bg);color:#fff;padding:20px;text-align:center}
    .btn{padding:15px 20px;border-radius:12px;border:1px solid #ffffff26;background:var(--chip);color:#fff;font-weight:600;cursor:pointer;font-size:16px;min-width:200px}
    .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    #log{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;color:#0ff;background:#001014cc;padding:8px 10px;border-radius:10px;font:11px/1.3 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:25vh;overflow:auto}
    #demoWrap{position:fixed;inset:0;background:#f5f5f5;display:none}
    a-scene{position:fixed;inset:0;width:100%;height:100%}
    .hint{opacity:.8;font-size:13px;max-width:90%}
    .back-btn{position:fixed;top:20px;left:20px;z-index:100;padding:10px 15px;background:#000000ee;color:#fff;border:1px solid #ffffff26;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600}
    .debug-info{position:fixed;top:20px;right:20px;z-index:100;background:#000000cc;color:#fff;padding:8px;border-radius:6px;font-size:11px;max-width:150px}
  </style>
</head>
<body>
  <div id="screen">
    <div style="font-size:20px;opacity:.9;margin-bottom:10px">🔬 AR + Demo 3D</div>
    <div class="row">
      <button class="btn" id="btnAR">📱 AR con Marcador</button>
      <button class="btn" id="btnDemo">🎯 Demo 3D</button>
    </div>
    <div class="hint">AR: Apunta a tu marcador impreso | Demo: Arrastra para rotar, pellizca para zoom</div>
  </div>

  <div id="demoWrap"></div>
  <div id="log"></div>

  <script>
    // ---------- Utilidades ----------
    const logEl = document.getElementById('log');
    const log = m => { 
      console.log(m); 
      logEl.textContent += (logEl.textContent?'\n':'') + m; 
      logEl.scrollTop = logEl.scrollHeight;
    };
    
    const isMobile = /Mobi|Android/i.test(navigator.userAgent);
    const isSecure = location.protocol.startsWith('https') || location.hostname === 'localhost';
    
    if(!isSecure) log('⚠️ Requiere HTTPS para cámara');
    if(!window.AFRAME) log('❌ A-Frame NO cargó');
    if(isMobile) log('📱 Dispositivo móvil detectado');

    // Componente para centrar y escalar modelo apropiadamente
    AFRAME.registerComponent('smart-model', {
      schema: {
        targetSize: {type: 'number', default: 1.0}
      },
      init(){
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if(!obj) { log('⚠️ No se pudo cargar el modelo 3D'); return; }
          
          const box = new THREE.Box3().setFromObject(obj);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDimension = Math.max(size.x, size.y, size.z);
          
          obj.position.sub(center);
          
          const scale = this.data.targetSize / maxDimension;
          obj.scale.setScalar(scale);
          
          obj.traverse(node => {
            if(node.isMesh){
              node.frustumCulled = false;
              node.castShadow = true;
              node.receiveShadow = true;
            }
          });
          
          log(`✅ Modelo cargado y ajustado (escala: ${scale.toFixed(2)})`);
        });
      }
    });

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function addBackButton(callback) {
      const btn = document.createElement('button');
      btn.className = 'back-btn';
      btn.innerHTML = '← Menú';
      btn.onclick = callback;
      document.body.appendChild(btn);
      return btn;
    }

    // ===== DEMO 3D CORREGIDO Y MEJORADO =====
    function startDemo(){
      document.getElementById('screen').style.display='none';
      const wrap = document.getElementById('demoWrap');
      wrap.style.display='block';

      // CAMBIO: Estructura HTML con un pivote para la rotación.
      wrap.innerHTML = `
        <a-scene id="demoScene" background="color: #f8f8f8"
                 renderer="colorManagement:true; antialias:${isMobile ? 'false' : 'true'};" 
                 vr-mode-ui="enabled:false">
          <a-assets timeout="30000">
            <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
          </a-assets>

          <a-entity light="type: ambient; intensity: 0.8"></a-entity>
          <a-entity light="type: directional; intensity: 1.0" position="2 3 2"></a-entity>

          <a-camera id="demoCamera" position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>

          <a-entity id="modelContainer" position="0 0 -2.5">
            <a-entity id="modelPivot">
              <a-gltf-model id="model3d" src="#covidModel" 
                            smart-model="targetSize: 1.2"></a-gltf-model>
            </a-entity>
          </a-entity>
        </a-scene>
      `;

      const backBtn = addBackButton(() => {
        wrap.style.display = 'none';
        document.getElementById('screen').style.display = 'grid';
        backBtn.remove();
        if(debugInfo) debugInfo.remove();
        document.getElementById('demoScene').remove();
      });

      let debugInfo = null;
      if(isMobile) {
        debugInfo = document.createElement('div');
        debugInfo.className = 'debug-info';
        document.body.appendChild(debugInfo);
      }

      const scene = document.getElementById('demoScene');
      scene.addEventListener('loaded', () => {
        // CAMBIO: Obtenemos referencias al contenedor y al nuevo pivote.
        const container = document.getElementById('modelContainer');
        const pivot = document.getElementById('modelPivot');
        const canvas = scene.renderer.domElement;

        const state = {
          isDragging: false,
          lastX: 0,
          lastY: 0,
          rotationX: 0,
          rotationY: 0,
          distance: 2.5,
          minDistance: 1.2,
          maxDistance: 6.0,
          sensitivity: isMobile ? 0.6 : 0.4,
          lastTouchDistance: null
        };

        function updateDebugInfo() {
          if(debugInfo) {
            debugInfo.innerHTML = `Rot: ${state.rotationX.toFixed(0)}°, ${state.rotationY.toFixed(0)}°<br>Dist: ${state.distance.toFixed(1)}`;
          }
        }
        updateDebugInfo();

        const getPointerPos = e => e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };

        function onPointerDown(e) {
          state.isDragging = true;
          const pos = getPointerPos(e);
          state.lastX = pos.x;
          state.lastY = pos.y;
          canvas.style.cursor = 'grabbing';
        }

        function onPointerUp() {
          state.isDragging = false;
          canvas.style.cursor = 'grab';
          state.lastTouchDistance = null; // Reset pinch zoom state
        }

        function onPointerMove(e) {
          if (!state.isDragging) return;
          const pos = getPointerPos(e);
          const deltaX = pos.x - state.lastX;
          const deltaY = pos.y - state.lastY;
          state.rotationY += deltaX * state.sensitivity;
          state.rotationX -= deltaY * state.sensitivity;
          state.rotationX = clamp(state.rotationX, -80, 80);
          
          // CAMBIO: Aplicamos la rotación solo al PIVOTE.
          pivot.setAttribute('rotation', `${state.rotationX} ${state.rotationY} 0`);

          state.lastX = pos.x;
          state.lastY = pos.y;
          updateDebugInfo();
        }
        
        function handlePinch(e) {
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          const currentDist = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);

          if (state.lastTouchDistance) {
            const ratio = state.lastTouchDistance / currentDist;
            state.distance *= ratio;
            state.distance = clamp(state.distance, state.minDistance, state.maxDistance);
            
            // CAMBIO: Aplicamos el zoom (distancia) solo al CONTENEDOR.
            container.setAttribute('position', `0 0 ${-state.distance}`);
            updateDebugInfo();
          }
          state.lastTouchDistance = currentDist;
        }

        function handleWheel(e) {
          state.distance += Math.sign(e.deltaY) * 0.15;
          state.distance = clamp(state.distance, state.minDistance, state.maxDistance);
          container.setAttribute('position', `0 0 ${-state.distance}`);
          updateDebugInfo();
        }
        
        // --- Event Listeners Unificados ---
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', onPointerUp);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('wheel', handleWheel, { passive: true });

        canvas.addEventListener('touchstart', e => {
          if (e.touches.length === 1) onPointerDown(e);
          e.preventDefault();
        }, { passive: false });
        
        canvas.addEventListener('touchend', onPointerUp);
        
        canvas.addEventListener('touchmove', e => {
          if (e.touches.length === 1 && state.isDragging) onPointerMove(e);
          else if (e.touches.length === 2) handlePinch(e);
          e.preventDefault();
        }, { passive: false });

        canvas.style.cursor = 'grab';
        log(`✅ Demo listo (${isMobile ? 'móvil' : 'desktop'})`);
      });
    }

    // ===== AR CORREGIDO Y MEJORADO =====
    function startAR(){
      document.getElementById('screen').style.display='none';
      
      if(!isSecure){ 
        log('❌ AR requiere HTTPS para la cámara');
        addBackButton(() => { document.getElementById('screen').style.display = 'grid'; });
        return;
      }

      const sceneHTML = `
        <a-scene id="arScene"
          mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
          renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true;"
          vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled: false" embedded>
          
          <a-assets timeout="30000">
            <a-asset-item id="covidModelAR" src="./covid.glb"></a-asset-item>
          </a-assets>

          <a-entity light="type: ambient; intensity: 0.8"></a-entity>
          <a-entity light="type: directional; intensity: 1.2" position="0 1 1"></a-entity>
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

          <a-entity id="anchor" mindar-image-target="targetIndex: 0">
            <a-gltf-model id="arModel" src="#covidModelAR" 
                          smart-model="targetSize: 0.8"
                          position="0 0 0"
                          rotation="-90 0 0"
                          visible="false">
            </a-gltf-model>
          </a-entity>
        </a-scene>
      `;
      document.body.insertAdjacentHTML('beforeend', sceneHTML);

      const backBtn = addBackButton(() => {
        const scene = document.getElementById('arScene');
        if (scene) {
          scene.systems['mindar-image-system'].stop(); // Detener cámara
          scene.remove();
        }
        document.getElementById('screen').style.display = 'grid';
        backBtn.remove();
      });

      const scene = document.getElementById('arScene');
      scene.addEventListener('loaded', () => {
        const anchor = document.getElementById('anchor');
        const model = document.getElementById('arModel');
        
        anchor.addEventListener('targetFound', () => {
          log('🎯 ¡MARCADOR ENCONTRADO!');
          model.setAttribute('visible', 'true');
          model.setAttribute('animation', 'property: scale; to: 1.1 1.1 1.1; dur: 400; dir: alternate; loop: 2; easing: easeInOutQuad');
        });
        
        // CAMBIO: Se añade el evento para ocultar el modelo al perder el marcador.
        anchor.addEventListener('targetLost', () => {
          log('❌ Marcador perdido');
          model.setAttribute('visible', 'false');
        });
        
        log('✅ AR listo - busca tu marcador');
      });
    }

    // Event listeners
    document.getElementById('btnDemo').addEventListener('click', startDemo);
    document.getElementById('btnAR').addEventListener('click', startAR);

    log('📁 Archivos necesarios: aframe.min.js, mindar-image-aframe.prod.js, covid.glb, targets.mind');
  </script>
</body>
</html>
