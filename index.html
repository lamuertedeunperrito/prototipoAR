<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>WebAR con MindAR – Image Tracking</title>
    
    <!-- OPCIÓN A: Librerías locales (recomendado) -->
    <!-- Descarga y sube estos archivos a tu repositorio:
         1. aframe.min.js (desde https://github.com/aframevr/aframe/releases/tag/v1.4.0)
         2. mindar-image-aframe.prod.js (desde mind-ar releases)
         Luego descomenta estas líneas: -->

    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>

    
    <!-- OPCIÓN B: Fallback usando GitHub raw (temporal) -->
    <script src="https://raw.githubusercontent.com/aframevr/aframe/v1.4.0/dist/aframe.min.js"></script>
    <script>
        // Verificar que A-Frame se cargó
        function checkAFrame() {
            if (typeof AFRAME !== 'undefined') {
                console.log('✅ A-Frame cargado correctamente');
                loadMindAR();
            } else {
                console.log('⏳ Esperando A-Frame...');
                setTimeout(checkAFrame, 100);
            }
        }
        
        function loadMindAR() {
            const script = document.createElement('script');
            // Usando un CDN alternativo más pequeño
            script.src = 'https://raw.githubusercontent.com/hiukim/mind-ar-js/master/dist/mindar-image-aframe.prod.js';
            script.onload = () => {
                console.log('✅ MindAR cargado');
                window.AR_READY = true;
            };
            script.onerror = () => {
                console.error('❌ Error cargando MindAR');
                // Crear versión simplificada sin MindAR
                createSimplifiedAR();
            };
            document.head.appendChild(script);
        }
        
        // Iniciar verificación cuando termine de cargar el HTML
        setTimeout(checkAFrame, 100);
    </script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        #ui {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        
        #ui .chip {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
        
        #help {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            line-height: 1.4;
            backdrop-filter: blur(10px);
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        a-scene {
            width: 100vw;
            height: 100vh;
        }
        
        .a-enter-vr {
            display: none !important;
        }
        
        #debug {
            position: fixed;
            bottom: 80px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 10px;
            max-height: 60px;
            overflow-y: auto;
            z-index: 1000;
        }
        
        #simplifiedMode {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Cargando AR...</div>
    </div>
    
    <div id="ui" style="display: none;">
        <div class="chip">📷 Apunta al marcador impreso</div>
        <div class="chip">🔄 Toca y arrastra para rotar</div>
    </div>
    
    <div id="debug"></div>
    
    <div id="simplifiedMode">
        <h3>🔧 Modo Simplificado</h3>
        <p>MindAR no disponible.<br>Mostrando modelo 3D básico.</p>
        <button onclick="startSimplified()" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer;">
            Continuar
        </button>
    </div>
    
    <!-- La escena se crea dinámicamente -->

    <div id="help" style="display: none;">
        <strong>💡 Consejos:</strong><br>
        • Permite acceso a la cámara<br>
        • Mantén buena iluminación<br>
        • Si no hay marcador, verás el modelo 3D flotando
    </div>

    <script>
        let debugLogs = [];
        let arScene;
        
        function log(message) {
            console.log(message);
            debugLogs.push(message);
            const debugEl = document.getElementById('debug');
            if (debugEl && debugLogs.length <= 5) {
                debugEl.innerHTML = debugLogs.slice(-5).join('<br>');
            }
        }

        function updateLoadingText(text) {
            const loadingText = document.getElementById('loadingText');
            if (loadingText) loadingText.textContent = text;
            log(text);
        }

        // Versión simplificada sin MindAR para casos extremos
        function createSimplifiedAR() {
            log('🔧 Creando AR simplificado sin MindAR');
            document.getElementById('loading').style.display = 'none';
            document.getElementById('simplifiedMode').style.display = 'block';
        }

        function startSimplified() {
            document.getElementById('simplifiedMode').style.display = 'none';
            
            const sceneHTML = `
            <a-scene
                id="arScene"
                background="color: #000"
                vr-mode-ui="enabled: false"
                device-orientation-permission-ui="enabled: false"
                loading-screen="enabled: false"
                embedded
            >
                <a-assets>
                    <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
                </a-assets>

                <a-light type="ambient" intensity="0.6"></a-light>
                <a-light type="directional" position="2 4 5" intensity="0.4"></a-light>

                <a-gltf-model 
                    id="model3d"
                    src="#covidModel" 
                    position="0 -1 -3" 
                    rotation="0 0 0" 
                    scale="0.5 0.5 0.5"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
                >
                </a-gltf-model>

                <a-camera 
                    position="0 0 0"
                    look-controls="enabled: true"
                    wasd-controls="enabled: false"
                ></a-camera>
            </a-scene>
            `;

            document.body.insertAdjacentHTML('beforeend', sceneHTML);
            showUI();
            setTimeout(() => document.getElementById('debug').style.display = 'none', 3000);
        }

        function createARScene() {
            log('🎬 Creando escena AR completa');
            updateLoadingText('Creando escena AR...');
            
            const sceneHTML = `
            <a-scene
                id="arScene"
                mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; warmupTolerance: 5; missTolerance: 5"
                color-space="sRGB"
                renderer="colorManagement: true; physicallyCorrectLights: true"
                vr-mode-ui="enabled: false"
                device-orientation-permission-ui="enabled: false"
                loading-screen="enabled: false"
                embedded
            >
                <a-assets>
                    <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
                </a-assets>

                <a-light type="ambient" intensity="0.8"></a-light>
                <a-light type="directional" position="2 4 5" intensity="0.5"></a-light>

                <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
                    <a-gltf-model 
                        id="model3d"
                        src="#covidModel" 
                        position="0 0 0" 
                        rotation="0 0 0" 
                        scale="0.3 0.3 0.3"
                        animation-mixer
                    >
                    </a-gltf-model>
                </a-entity>

                <a-camera 
                    position="0 0 0"
                    look-controls="enabled: false"
                    cursor="rayOrigin: mouse"
                ></a-camera>
            </a-scene>
            `;

            document.body.insertAdjacentHTML('beforeend', sceneHTML);
            setTimeout(setupAREvents, 500);
        }

        function setupAREvents() {
            arScene = document.querySelector('#arScene');
            
            if (!arScene) {
                log('❌ Error creando escena');
                createSimplifiedAR();
                return;
            }

            log('🎯 Configurando eventos AR...');

            arScene.addEventListener('renderstart', function() {
                log('✅ AR iniciado - cámara activa');
                setTimeout(() => {
                    hideLoading();
                    showUI();
                }, 1000);
            });

            const targetEntity = document.querySelector('#targetEntity');
            if (targetEntity) {
                targetEntity.addEventListener('targetFound', function() {
                    log('🎯 Target encontrado!');
                    const model = document.querySelector('#model3d');
                    if (model) {
                        model.setAttribute('animation', {
                            property: 'rotation',
                            to: '0 360 0',
                            loop: true,
                            dur: 6000
                        });
                    }
                });

                targetEntity.addEventListener('targetLost', function() {
                    log('❌ Target perdido');
                });
            }

            updateLoadingText('Iniciando cámara...');
            
            // Timeout de seguridad
            setTimeout(() => {
                if (document.getElementById('loading').style.display !== 'none') {
                    log('⏰ Timeout - iniciando UI');
                    hideLoading();
                    showUI();
                }
            }, 8000);
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            setTimeout(() => {
                const debug = document.getElementById('debug');
                if (debug) debug.style.display = 'none';
            }, 4000);
        }

        function showUI() {
            const ui = document.querySelector('#ui');
            const help = document.querySelector('#help');
            
            if (ui) ui.style.display = 'flex';
            if (help) help.style.display = 'block';
        }

        function checkCompatibility() {
            const isHTTPS = location.protocol === 'https:' || location.hostname === 'localhost';
            const hasUserMedia = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
            
            log(`🔍 HTTPS: ${isHTTPS}, Camera: ${hasUserMedia}`);
            
            if (!isHTTPS) {
                createSimplifiedAR();
                return false;
            }
            
            return true;
        }

        async function checkFiles() {
            const files = [
                { path: './targets.mind', name: 'targets.mind' },
                { path: './covid.glb', name: 'covid.glb' }
            ];
            
            for (const file of files) {
                try {
                    const response = await fetch(file.path, { method: 'HEAD' });
                    log(`${response.ok ? '✅' : '❌'} ${file.name} ${response.ok ? 'OK' : 'faltante'}`);
                } catch (error) {
                    log(`❌ ${file.name} error`);
                }
            }
        }

        function waitForARReady() {
            if (window.AR_READY) {
                log('🚀 Todo listo, creando AR');
                checkFiles();
                createARScene();
            } else {
                log('⏳ Esperando MindAR...');
                setTimeout(waitForARReady, 200);
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            log('📱 DOM listo');
            
            if (!checkCompatibility()) {
                return;
            }

            updateLoadingText('Verificando librerías...');
            
            // Esperar a que se carguen las librerías
            setTimeout(() => {
                if (typeof AFRAME !== 'undefined') {
                    log('✅ A-Frame OK');
                    waitForARReady();
                } else {
                    log('❌ A-Frame falló - modo simplificado');
                    createSimplifiedAR();
                }
            }, 2000);
        });

        window.addEventListener('error', function(e) {
            log(`💥 Error: ${e.error?.message || 'Desconocido'}`);
        });
    </script>
</body>
</html>
