<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>AR (MindAR) + Demo 3D</title>

  <!-- Librerías locales en la RAÍZ -->
  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>

  <style>
    :root { --bg:#0b0f13; --chip:#ffffff18; }
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    #screen{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--bg);color:#fff;padding:20px;text-align:center}
    .btn{padding:12px 16px;border-radius:12px;border:1px solid #ffffff26;background:var(--chip);color:#fff;font-weight:600;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    #log{position:fixed;left:12px;right:12px;bottom:12px;z-index:10;color:#0ff;background:#001014cc;padding:8px 10px;border-radius:10px;font:12px/1.3 ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:34vh;overflow:auto}
    #demoWrap{position:fixed;inset:0;background:#fff;display:none}
    a-scene{position:fixed;inset:0}
    .hint{opacity:.8;font-size:12px}
  </style>
</head>
<body>
  <div id="screen">
    <div style="font-size:18px;opacity:.9">Prototipo: MindAR (marcador) + Demo 3D</div>
    <div class="row">
      <button class="btn" id="btnAR">🚀 Iniciar AR (marcador)</button>
      <button class="btn" id="btnDemo">🎮 Demo 3D (sin AR)</button>
    </div>
    <div class="hint">AR: arrastra para rotar, pinza/rueda para zoom (anclado al marcador). Demo: igual, en fondo blanco.</div>
  </div>

  <div id="demoWrap"></div>
  <div id="log"></div>

  <script>
    // ---------- utilidades ----------
    const logEl = document.getElementById('log');
    const log = m => { console.log(m); logEl.textContent += (logEl.textContent?'\n':'') + m; logEl.scrollTop = logEl.scrollHeight; };
    const isSecure = location.protocol.startsWith('https') || location.hostname === 'localhost';
    if(!isSecure) log('⚠️ Requiere HTTPS para usar la cámara.');
    if(!window.AFRAME) log('❌ A-Frame NO cargó (revisa aframe.min.js).');

    // =============== DEMO 3D (sin AR) ===============
    function startDemo(){
      document.getElementById('screen').style.display='none';
      const wrap = document.getElementById('demoWrap');
      wrap.style.display='block';

      wrap.innerHTML = `
        <a-scene id="demoScene" background="color: #ffffff"
                 renderer="colorManagement:true; antialias:false" vr-mode-ui="enabled:false">
          <a-assets timeout="30000">
            <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
          </a-assets>

          <a-entity light="type: ambient; intensity: 1.0"></a-entity>
          <a-entity light="type: directional; intensity: 0.9" position="1 1 1"></a-entity>

          <!-- Más grande y más cerca -->
          <a-entity id="pivot" position="0 1.2 -0.8" rotation="0 0 0">
            <a-gltf-model id="model3d" src="#covidModel" scale="0.9 0.9 0.9"></a-gltf-model>
          </a-entity>

          <a-camera position="0 1.2 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
        </a-scene>
      `;

      const scene = document.getElementById('demoScene');
      scene.addEventListener('loaded', ()=>{
        const pivot = document.getElementById('pivot');
        const canvas = scene.renderer.domElement;

        // Rotación 2 ejes + inercia
        const st = {
          dragging:false, lastX:0, lastY:0,
          rotY:0, rotX:0, velY:0, velX:0,
          dist:0.8, min:0.4, max:5.0
        };

        (function tick(){
          // inercia
          if(Math.abs(st.velY)>0.0005){ st.rotY += st.velY; st.velY *= 0.95; } else { st.velY=0; }
          if(Math.abs(st.velX)>0.0005){ st.rotX += st.velX; st.velX *= 0.95; } else { st.velX=0; }
          st.rotX = clamp(st.rotX, -80, 80);
          pivot.setAttribute('rotation', {x:st.rotX, y:st.rotY, z:0});
          requestAnimationFrame(tick);
        })();

        const pd = e=>{ st.dragging=true; st.lastX=e.clientX; st.lastY=e.clientY; st.velX=0; st.velY=0; };
        const pu = ()=>{ st.dragging=false; };
        const pm = e=>{
          if(!st.dragging) return;
          const dx=e.clientX-st.lastX, dy=e.clientY-st.lastY;
          st.lastX=e.clientX; st.lastY=e.clientY;
          st.rotY += dx*0.35;
          st.rotX -= dy*0.25;
          st.velY  = dx*0.035;
          st.velX  = -dy*0.025;
        };
        canvas.addEventListener('pointerdown', pd);
        canvas.addEventListener('pointerup', pu);
        canvas.addEventListener('pointerleave', pu);
        canvas.addEventListener('pointermove', pm);

        // zoom rueda
        canvas.addEventListener('wheel', e=>{
          e.preventDefault();
          st.dist = clamp(st.dist + Math.sign(e.deltaY)*0.15, st.min, st.max);
          pivot.setAttribute('position', `0 1.2 ${-st.dist}`);
        }, {passive:false});

        // pinch-zoom
        let lastDist=0;
        canvas.addEventListener('touchmove', e=>{
          if(e.touches && e.touches.length===2){
            const [a,b]=e.touches, dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
            const d=Math.hypot(dx,dy);
            if(lastDist){
              const delta=(lastDist-d)/350;
              st.dist = clamp(st.dist + delta, st.min, st.max);
              pivot.setAttribute('position', `0 1.2 ${-st.dist}`);
            }
            lastDist=d;
          }
        }, {passive:true});
        canvas.addEventListener('touchend', ()=>{ lastDist=0; });

        const asset = document.getElementById('covidModel');
        asset.addEventListener('loaded', ()=>log('✅ covid.glb cargado (DEMO)'));
        asset.addEventListener('error',  e=>log('❌ Error covid.glb (DEMO) '+(e?.detail||'')));

        function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
        log('✅ Demo 3D listo (2 ejes + inercia, modelo grande).');
      });
    }

    // =============== AR (MindAR) con gestos (anclado) ===============
    function startAR(){
      document.getElementById('screen').style.display='none';
      if(!isSecure){ log('❌ Sin HTTPS: la cámara no abrirá.'); return; }
      if(!navigator.mediaDevices?.getUserMedia){ log('❌ Este navegador no soporta cámara.'); return; }

      const sceneHTML = `
        <a-scene id="arScene"
          mindar-image="imageTargetSrc: ./targets.mind;"
          renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true; antialias:false"
          vr-mode-ui="enabled:false"
          device-orientation-permission-ui="enabled:true"
          embedded>
          <a-assets timeout="30000">
            <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
          </a-assets>

          <a-entity light="type: ambient; intensity: 1.0"></a-entity>
          <a-entity light="type: directional; intensity: 0.9" position="1 1 1"></a-entity>

          <!-- Anclado al marcador: el anchor da posición/orientación base -->
          <a-entity id="anchor" mindar-image-target="targetIndex:0">
            <!-- Pivot que SÍ podemos rotar/escalar con gestos, pero queda en 0,0,0 del marcador -->
            <a-entity id="pivotAR" position="0 0 0" rotation="0 0 0" scale="1 1 1">
              <a-gltf-model id="mAR" src="#covidModel" scale="0.9 0.9 0.9"></a-gltf-model>
            </a-entity>
          </a-entity>

          <a-camera position="0 0 0"></a-camera>
        </a-scene>
      `;
      document.body.insertAdjacentHTML('beforeend', sceneHTML);

      const scene = document.getElementById('arScene');
      scene.addEventListener('loaded', ()=> log('✅ Escena AR cargada'));
      scene.addEventListener('renderstart', ()=> log('🎥 Cámara activa'));

      // tracking logs
      setTimeout(()=>{
        const a=document.getElementById('anchor');
        if(a){
          a.addEventListener('targetFound', ()=> log('🔵 target FOUND'));
          a.addEventListener('targetLost',  ()=> log('⚪ target LOST'));
        }
      }, 600);

      // Gestos en AR: rotación 2 ejes + inercia sobre pivotAR, y zoom por escala del pivot
      scene.addEventListener('loaded', ()=>{
        const pivot = document.getElementById('pivotAR');
        const canvas = scene.renderer.domElement;

        // Estado de manipulación (no tocamos la posición para mantenerlo anclado)
        const st = {
          dragging:false, lastX:0, lastY:0,
          rotY:0, rotX:0, velY:0, velX:0,
          scale:1.0, min:0.4, max:2.0
        };

        (function tick(){
          // inercia suave
          if(Math.abs(st.velY)>0.0005){ st.rotY += st.velY; st.velY *= 0.95; } else { st.velY=0; }
          if(Math.abs(st.velX)>0.0005){ st.rotX += st.velX; st.velX *= 0.95; } else { st.velX=0; }
          st.rotX = clamp(st.rotX, -80, 80); // limitar pitch
          pivot.setAttribute('rotation', {x:st.rotX, y:st.rotY, z:0});
          requestAnimationFrame(tick);
        })();

        const pd = e=>{ st.dragging=true; st.lastX=e.clientX; st.lastY=e.clientY; st.velX=0; st.velY=0; };
        const pu = ()=>{ st.dragging=false; };
        const pm = e=>{
          if(!st.dragging) return;
          const dx=e.clientX-st.lastX, dy=e.clientY-st.lastY;
          st.lastX=e.clientX; st.lastY=e.clientY;
          st.rotY += dx*0.35;
          st.rotX -= dy*0.25;
          st.velY  = dx*0.035;
          st.velX  = -dy*0.025;
        };
        canvas.addEventListener('pointerdown', pd);
        canvas.addEventListener('pointerup', pu);
        canvas.addEventListener('pointerleave', pu);
        canvas.addEventListener('pointermove', pm);

        // pinch-zoom (escala del pivot)
        let lastDist=0;
        canvas.addEventListener('touchmove', e=>{
          if(e.touches && e.touches.length===2){
            const [a,b]=e.touches, dx=a.clientX-b.clientX, dy=a.clientY-b.clientY;
            const d=Math.hypot(dx,dy);
            if(lastDist){
              const delta=(d-lastDist)/600; // sensibilidad AR un poco más fina
              st.scale = clamp(st.scale + delta, st.min, st.max);
              pivot.setAttribute('scale', `${st.scale} ${st.scale} ${st.scale}`);
            }
            lastDist=d;
          }
        }, {passive:true});
        canvas.addEventListener('touchend', ()=>{ lastDist=0; });

        // scroll-zoom en desktop
        canvas.addEventListener('wheel', e=>{
          e.preventDefault();
          st.scale = clamp(st.scale + (Math.sign(e.deltaY)*-0.05), st.min, st.max);
          pivot.setAttribute('scale', `${st.scale} ${st.scale} ${st.scale}`);
        }, {passive:false});

        const asset = document.getElementById('covidModel');
        asset.addEventListener('loaded', ()=>log('✅ covid.glb cargado (AR)'));
        asset.addEventListener('error',  e=>log('❌ Error covid.glb (AR) '+(e?.detail||'')));
      });

      function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
    }

    // helpers / binding
    document.getElementById('btnDemo').addEventListener('click', startDemo);
    document.getElementById('btnAR').addEventListener('click', startAR);
  </script>
</body>
</html>
