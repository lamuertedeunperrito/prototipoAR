<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Visor 360° para Cardboard (Foto Equirectangular)</title>
  <!-- Si ya tienes A-Frame local, usa tu ruta: <script src="./aframe.min.js"></script> -->
  <script src="https://unpkg.com/aframe@1.5.0/dist/aframe.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; }
    #ui { position: fixed; inset: auto 0 0 0; background: linear-gradient(transparent, rgba(0,0,0,.75)); padding: 10px 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; z-index: 10; }
    .row { display:flex; align-items:center; gap:6px; }
    input[type="range"] { width: 140px; }
    #msg { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 10px; font-size: 12px; z-index: 10; }
    #enterVRBtn, #fsBtn, #resetBtn, #gyroBtn { background:#0a84ff; border:none; color:#fff; padding:10px 12px; border-radius:10px; font-weight:600; }
    #fsBtn { background:#14b8a6; }
    #resetBtn { background:#f59e0b; }
    #gyroBtn { background:#7c3aed; }
    #file { appearance:none; background:#111; color:#fff; border:1px solid #333; border-radius:10px; padding:8px; }
    a-scene { width:100vw; height:100vh; }
    #status { position: fixed; right: 8px; bottom: 70px; background: rgba(0,0,0,.55); padding:6px 8px; border-radius:8px; font-size:12px; z-index: 10; }
  </style>
</head>
<body>
  <div id="msg">Carga una foto 360° equirectangular (2:1). Toca <b>Habilitar giroscopio</b> en iOS para que siga el movimiento del celu. Luego <b>Entrar en VR</b> para Cardboard.</div>
  <div id="status">Estado: <span id="st">inicializando…</span></div>

  <!-- Escena VR -->
  <a-scene id="scene" renderer="antialias: true" vr-mode-ui="enterVRButton: #enterVRBtn">
    <a-assets id="assets" timeout="15000">
      <img id="pano" crossorigin="anonymous" />
    </a-assets>

    <!-- Cámara: look-controls usa el giroscopio en móvil (también en VR) -->
    <a-entity id="rig">
      <a-entity id="camera" camera="fov: 80" look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true" position="0 1.6 0"></a-entity>
    </a-entity>

    <!-- ENVOLTURA ESFÉRICA INTERIOR: así se ve 360. side: back pinta la cara interna. -->
    <a-sky id="sky" color="#222" radius="5000" material="shader: flat; side: back;"></a-sky>
  </a-scene>

  <!-- UI -->
  <div id="ui">
    <input id="file" type="file" accept="image/*" />
    <span id="fname" style="opacity:.8;font-size:12px"></span>
    <button id="gyroBtn">🧭 Habilitar giroscopio</button>
    <button id="enterVRBtn">🎬 Entrar en VR</button>
    <button id="fsBtn">⤢ Pantalla completa</button>
    <button id="resetBtn">↺ Reset vista</button>
    <div class="row">
      <label>FOV</label>
      <input id="fov" type="range" min="40" max="110" step="1" value="80" />
      <span id="fovVal">80°</span>
    </div>
    <div class="row">
      <label>Giro Y</label>
      <input id="yaw" type="range" min="-180" max="180" step="1" value="0" />
      <span id="yawVal">0°</span>
    </div>
  </div>

  <script>
    const stEl = document.getElementById('st');
    const sceneEl = document.getElementById('scene');
    const file = document.getElementById('file');
    const fname = document.getElementById('fname');
    const panoImg = document.getElementById('pano');
    const sky  = document.getElementById('sky');
    const cameraEl = document.getElementById('camera');
    const rigEl = document.getElementById('rig');
    const fov = document.getElementById('fov');
    const fovVal = document.getElementById('fovVal');
    const yaw = document.getElementById('yaw');
    const yawVal = document.getElementById('yawVal');
    const fsBtn = document.getElementById('fsBtn');
    const resetBtn = document.getElementById('resetBtn');
    const gyroBtn = document.getElementById('gyroBtn');

    function setStatus(t){ stEl.textContent = t; console.log('[360]', t); }

    // Escena lista
    sceneEl.addEventListener('loaded', () => setStatus('escena cargada'));

    // Carga imagen → aplicamos a <a-sky>
    file.addEventListener('change', () => {
      const img = file.files && file.files[0];
      if (!img) return;
      fname.textContent = img.name;
      const url = URL.createObjectURL(img);
      const tmp = new Image();
      tmp.onload = () => {
        const ratio = tmp.width / tmp.height;
        if (Math.abs(ratio - 2.0) > 0.1) {
          setStatus(`⚠️ La imagen no parece 2:1 (${tmp.width}×${tmp.height}). Igual la cargo.`);
        } else {
          setStatus(`dimensiones OK (${tmp.width}×${tmp.height})`);
        }
        panoImg.onload = () => {
          sky.setAttribute('src', '#pano');
          setStatus('textura aplicada al cielo 360');
        };
        panoImg.src = url;
      };
      tmp.onerror = () => { setStatus('❌ No se pudo leer la imagen'); };
      tmp.src = url;
    });

    // Habilitar giroscopio (necesario en iOS 13+ por gesto del usuario)
    async function enableGyro(){
      try {
        // iOS: DeviceMotionEvent/DeviceOrientationEvent requieren permiso explícito
        const dom = window.DeviceMotionEvent;
        const doe = window.DeviceOrientationEvent;
        if (dom && typeof dom.requestPermission === 'function') {
          const s1 = await dom.requestPermission();
          setStatus('permiso motion: ' + s1);
        }
        if (doe && typeof doe.requestPermission === 'function') {
          const s2 = await doe.requestPermission();
          setStatus('permiso orientation: ' + s2);
        }
        // A-Frame look-controls ya escucha sensores; forzamos re-init
        const lc = cameraEl.components['look-controls'];
        if (lc && lc.hasOwnProperty('updateDelta')) {
          lc.update(0);
        }
      } catch(e){
        console.warn(e); setStatus('⚠️ No se pudo habilitar giroscopio: ' + e.message);
      }
    }
    gyroBtn.addEventListener('click', enableGyro);

    // FOV y Yaw
    function applyFov() { const v = parseInt(fov.value, 10); fovVal.textContent = v + '°'; cameraEl.setAttribute('camera', 'fov', v); }
    function applyYaw(){ const v = parseInt(yaw.value, 10); yawVal.textContent = v + '°'; rigEl.setAttribute('rotation', `0 ${v} 0`); }
    fov.addEventListener('input', applyFov); applyFov();
    yaw.addEventListener('input', applyYaw); applyYaw();

    // Reset
    resetBtn.addEventListener('click', () => {
      rigEl.setAttribute('rotation', '0 0 0');
      yaw.value = 0; yawVal.textContent = '0°';
      const lc = cameraEl.components['look-controls'];
      if (lc && lc.pitchObject && lc.yawObject) {
        lc.pitchObject.rotation.x = 0;
        lc.yawObject.rotation.y = 0;
      }
      setStatus('vista reiniciada');
    });

    // Pantalla completa
    fsBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) { await document.documentElement.requestFullscreen(); setStatus('pantalla completa'); }
        else { await document.exitFullscreen(); setStatus('salió de pantalla completa'); }
      } catch (e) { alert('Pantalla completa no disponible: ' + e.message); }
    });
  </script>
</body>
</html>
