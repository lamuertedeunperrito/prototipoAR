<script>
  (function(){
    const st = (t)=>{ const el=document.getElementById('st'); if (el) el.textContent=t; console.log('[A‑Frame SBS]', t); };

    // 1) Componente: render SBS (sin cambios)
    AFRAME.registerComponent('cardboard-sbs', {
      schema: { ipd:{type:'number', default:0.064}, fov:{type:'number', default:80} },
      init(){
        const sceneEl = this.el.sceneEl;
        const renderer = sceneEl.renderer;
        const mainCamEl = document.querySelector('#camera');

        renderer.xr.enabled = false;
        renderer.autoClear = false;
        renderer.setScissorTest(true);

        this.leftCam  = new THREE.PerspectiveCamera(this.data.fov, 0.5, 0.01, 2000);
        this.rightCam = new THREE.PerspectiveCamera(this.data.fov, 0.5, 0.01, 2000);
        this.leftCam.matrixAutoUpdate = false;
        this.rightCam.matrixAutoUpdate = false;
        this.el.object3D.add(this.leftCam);
        this.el.object3D.add(this.rightCam);

        let last = 0;
        const loop = (time)=>{
          const w = renderer.domElement.width, h = renderer.domElement.height;
          const dt = last ? (time - last) : 0; last = time;
          sceneEl.tick(time, dt);

          const fov = this.data.fov;
          this.leftCam.fov = this.rightCam.fov = fov;
          this.leftCam.aspect = this.rightCam.aspect = (0.5*w)/h;
          this.leftCam.updateProjectionMatrix();
          this.rightCam.updateProjectionMatrix();

          const d = this.data.ipd * 0.5;
          this.leftCam.position.set(-d,0,0);
          this.rightCam.position.set(d,0,0);

          const q = mainCamEl.object3D.getWorldQuaternion(new THREE.Quaternion());
          this.leftCam.quaternion.copy(q);
          this.rightCam.quaternion.copy(q);

          renderer.clear();
          renderer.setViewport(0,0,w/2,h);
          renderer.setScissor(0,0,w/2,h);
          renderer.render(sceneEl.object3D, this.leftCam);
          renderer.setViewport(w/2,0,w/2,h);
          renderer.setScissor(w/2,0,w/2,h);
          renderer.render(sceneEl.object3D, this.rightCam);
        };
        renderer.setAnimationLoop(loop);
        st('✅ Split SBS activo');
      }
    });

    // 2) Downscale en móvil: (solo para imágenes)
    function downscaleImageToCanvas(img, maxW=4096){
      const ratio = img.width / img.height; 
      const targetW = Math.min(maxW, img.width);
      const targetH = Math.round(targetW / ratio);
      const c = document.createElement('canvas');
      c.width = targetW; c.height = targetH;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, targetW, targetH);
      return c;
    }

    // Función para ajustar brillo (sin cambios)
    let currentBrightness = 1.0;
    function updateBrightness(value) {
      currentBrightness = value / 100;
      if (window.skyMaterial) {
        window.skyMaterial.color.setScalar(currentBrightness);
      }
    }

    // 3) Lógica de Carga UNIFICADA (IMAGEN o VIDEO) - INICIO
    const sceneEl = document.getElementById('scene');
    
    function onReady(){
      st('escena cargada');
      const rig = document.getElementById('rig');
      rig.setAttribute('cardboard-sbs', 'ipd:0.064; fov:80');

      // REFERENCIAS A ELEMENTOS HTML
      const file = document.getElementById('file');
      const videoAsset = document.getElementById('video-asset'); // <--- ¡Aseguramos que se referencia aquí!
      const fovEl = document.getElementById('fov');
      const fovVal = document.getElementById('fovVal');
      const yawEl = document.getElementById('yaw');
      const yawVal = document.getElementById('yawVal');
      const brightnessEl = document.getElementById('brightness');
      const brightnessVal = document.getElementById('brightnessVal');

      file.addEventListener('change', ()=>{
        const f = file.files && file.files[0]; if(!f) return;
        const mimeType = f.type;
        const isImage = /^image\/(jpeg|png)$/i.test(mimeType);
        const isVideo = /^video\/(mp4|webm)$/i.test(mimeType);

        if (!isImage && !isVideo) { st('❌ solo JPG/PNG o MP4/WEBM'); return; }

        const url = URL.createObjectURL(f);
        const sky = document.getElementById('sky');
        const mesh = sky.getObject3D('mesh');
        if (!mesh) { st('⚠️ mesh de sky no listo'); return; }

        // Limpiar textura anterior y URL
        if (mesh.material.map) mesh.material.map.dispose();
        if (videoAsset.src) URL.revokeObjectURL(videoAsset.src); 
        
        // Manejo de IMAGEN
        if (isImage) {
          // Detener el video si estaba reproduciéndose
          videoAsset.pause();
          
          const img = new Image();
          img.onload = ()=>{
            const canvas = downscaleImageToCanvas(img, 4096);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.encoding = THREE.sRGBEncoding;

            const material = new THREE.MeshBasicMaterial({
              map: tex,
              side: THREE.BackSide,
              color: new THREE.Color(currentBrightness, currentBrightness, currentBrightness)
            });

            mesh.material = material;
            window.skyMaterial = material; 
            st('🖼️ textura 360 aplicada');
          };
          img.onerror = ()=> st('❌ no se pudo leer la imagen');
          img.src = url;

        // Manejo de VIDEO
        } else if (isVideo) {
          // Asigna la URL y comienza la reproducción
          videoAsset.src = url;
          videoAsset.load();
          
          // Reproducir inmediatamente (requiere 'muted' en HTML para móvil)
          videoAsset.play().then(() => {
            st('▶️ video 360 cargado y reproduciendo');
          }).catch(e => {
            st('⚠️ Error: Toca la pantalla para reproducir el video.');
          });
          
          // Crea la textura a partir del elemento de video HTML
          const tex = new THREE.VideoTexture(videoAsset);
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          
          // Aplica la textura de video al material
          const material = new THREE.MeshBasicMaterial({
            map: tex,
            side: THREE.BackSide,
            color: new THREE.Color(currentBrightness, currentBrightness, currentBrightness)
          });

          mesh.material = material;
          window.skyMaterial = material; 
          mesh.material.needsUpdate = true;
        }
      });

      // ... CÓDIGO DE CONTROLES (SIN CAMBIOS) ...
      function applyFov(){ 
        fovVal.textContent = fovEl.value + '°'; 
        const c = rig.getAttribute('cardboard-sbs'); 
        rig.setAttribute('cardboard-sbs', `ipd:${c.ipd}; fov:${parseFloat(fovEl.value)}`); 
      }
      
      function applyYaw(){ 
        yawVal.textContent = yawEl.value + '°'; 
        rig.object3D.rotation.y = THREE.MathUtils.degToRad(parseInt(yawEl.value,10)); 
      }
      
      function applyBrightness(){
        const value = parseInt(brightnessEl.value);
        brightnessVal.textContent = value + '%';
        updateBrightness(value);
      }
      
      fovEl.addEventListener('input', applyFov); applyFov();
      yawEl.addEventListener('input', applyYaw); applyYaw();
      brightnessEl.addEventListener('input', applyBrightness); applyBrightness();

      document.getElementById('gyroBtn').addEventListener('click', async ()=>{
        try{
          const dom = window.DeviceMotionEvent; const doe = window.DeviceOrientationEvent;
          if (dom && typeof dom.requestPermission === 'function') await dom.requestPermission();
          if (doe && typeof doe.requestPermission === 'function') await doe.requestPermission();
          try{ await screen.orientation.lock('landscape'); }catch(_){ }
          st('giroscopio habilitado');
        }catch(e){ st('⚠️ no se pudo habilitar gyro: '+e.message); }
      });

      document.getElementById('fsBtn').addEventListener('click', async ()=>{
        try{ 
          if(!document.fullscreenElement){ 
            await document.documentElement.requestFullscreen(); 
            st('pantalla completa'); 
          } else { 
            await document.exitFullscreen(); 
            st('salió de pantalla completa'); 
          } 
        }catch(e){ 
          alert('No se pudo entrar a pantalla completa: '+e.message); 
        }
      });
      
      document.getElementById('resetBtn').addEventListener('click', ()=>{
        rig.object3D.rotation.set(0,0,0); 
        yawEl.value=0; 
        yawVal.textContent='0°'; 
        brightnessEl.value=100;
        brightnessVal.textContent='100%';
        updateBrightness(100);
        st('vista reiniciada');
      });
    }
    if (sceneEl.hasLoaded) onReady(); else sceneEl.addEventListener('loaded', onReady);
  })();
  </script>
