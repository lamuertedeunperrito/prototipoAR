<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>WebAR con MindAR – Image Tracking</title>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        #ui {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        
        #ui .chip {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }
        
        #help {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            line-height: 1.4;
            backdrop-filter: blur(10px);
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        a-scene {
            width: 100vw;
            height: 100vh;
        }
        
        .a-enter-vr {
            display: none !important;
        }
        
        #debug {
            position: fixed;
            bottom: 80px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 10px;
            max-height: 100px;
            overflow-y: auto;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Buscando CDN disponible...</div>
    </div>
    
    <div id="ui" style="display: none;">
        <div class="chip">📷 Apunta al marcador impreso</div>
        <div class="chip">🔄 Toca y arrastra para rotar</div>
    </div>
    
    <div id="debug"></div>
    
    <!-- La escena se creará cuando esté todo listo -->

    <div id="help" style="display: none;">
        <strong>💡 Consejos:</strong><br>
        • Usa Chrome o Safari nativo<br>
        • Permite acceso a la cámara<br>
        • Mantén buena iluminación
    </div>

    <script>
        // Múltiples CDNs de respaldo
        const AFRAME_CDNS = [
            'https://unpkg.com/aframe@1.4.0/dist/aframe.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.0/aframe.min.js',
            'https://cdn.jsdelivr.net/npm/aframe@1.4.0/dist/aframe.min.js',
            'https://aframe.io/releases/1.4.0/aframe.min.js'
        ];

        const MINDAR_CDNS = [
            'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js',
            'https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js'
        ];

        let debugLog = [];
        let loadingText = document.getElementById('loadingText');
        let debugElement = document.getElementById('debug');

        function log(message) {
            console.log(message);
            debugLog.push(message);
            if (debugElement) {
                debugElement.innerHTML = debugLog.slice(-8).join('<br>');
            }
        }

        function updateLoadingText(text) {
            if (loadingText) {
                loadingText.textContent = text;
            }
            log(text);
        }

        function checkCompatibility() {
            const isHTTPS = location.protocol === 'https:' || location.hostname === 'localhost';
            const hasUserMedia = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
            
            log(`🔍 HTTPS: ${isHTTPS}, Camera: ${hasUserMedia}`);
            
            if (!isHTTPS) {
                showError('Se requiere HTTPS para acceder a la cámara');
                return false;
            }
            
            if (!hasUserMedia) {
                showError('Tu navegador no soporta acceso a cámara');
                return false;
            }
            
            return true;
        }

        // Función para probar un CDN
        function testCDN(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                const timeout = setTimeout(() => {
                    reject(new Error('Timeout'));
                    script.remove();
                }, 8000);

                script.onload = () => {
                    clearTimeout(timeout);
                    resolve();
                };
                
                script.onerror = () => {
                    clearTimeout(timeout);
                    reject(new Error('Load failed'));
                    script.remove();
                };
                
                script.src = url;
                document.head.appendChild(script);
            });
        }

        // Cargar A-Frame probando CDNs en secuencia
        async function loadAFrame() {
            updateLoadingText('Probando CDNs de A-Frame...');
            
            for (let i = 0; i < AFRAME_CDNS.length; i++) {
                const url = AFRAME_CDNS[i];
                const cdnName = new URL(url).hostname;
                
                try {
                    log(`📡 Probando ${cdnName}...`);
                    updateLoadingText(`Probando A-Frame desde ${cdnName}`);
                    
                    await testCDN(url);
                    
                    // Verificar que A-Frame realmente se cargó
                    if (typeof AFRAME !== 'undefined' && AFRAME.registerComponent) {
                        log(`✅ A-Frame cargado desde ${cdnName}`);
                        return true;
                    } else {
                        log(`❌ A-Frame no válido desde ${cdnName}`);
                        continue;
                    }
                } catch (error) {
                    log(`❌ Falló ${cdnName}: ${error.message}`);
                    continue;
                }
            }
            
            throw new Error('No se pudo cargar A-Frame desde ningún CDN');
        }

        // Cargar MindAR probando CDNs
        async function loadMindAR() {
            updateLoadingText('Probando CDNs de MindAR...');
            
            for (let i = 0; i < MINDAR_CDNS.length; i++) {
                const url = MINDAR_CDNS[i];
                const cdnName = new URL(url).hostname;
                
                try {
                    log(`📡 Probando MindAR desde ${cdnName}...`);
                    updateLoadingText(`Cargando MindAR desde ${cdnName}`);
                    
                    await testCDN(url);
                    log(`✅ MindAR cargado desde ${cdnName}`);
                    return true;
                } catch (error) {
                    log(`❌ Falló MindAR desde ${cdnName}: ${error.message}`);
                    continue;
                }
            }
            
            throw new Error('No se pudo cargar MindAR desde ningún CDN');
        }

        function createARScene() {
            log('🎬 Creando escena AR...');
            updateLoadingText('Creando escena AR...');
            
            const sceneHTML = `
            <a-scene
                id="arScene"
                mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; warmupTolerance: 5; missTolerance: 5"
                color-space="sRGB"
                renderer="colorManagement: true; physicallyCorrectLights: true"
                vr-mode-ui="enabled: false"
                device-orientation-permission-ui="enabled: false"
                loading-screen="enabled: false"
                embedded
            >
                <a-assets>
                    <a-asset-item id="covidModel" src="./covid.glb"></a-asset-item>
                </a-assets>

                <a-light type="ambient" intensity="0.8"></a-light>
                <a-light type="directional" position="2 4 5" intensity="0.5"></a-light>

                <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
                    <a-gltf-model 
                        id="model3d"
                        src="#covidModel" 
                        position="0 0 0" 
                        rotation="0 0 0" 
                        scale="0.3 0.3 0.3"
                        animation-mixer
                    >
                    </a-gltf-model>
                </a-entity>

                <a-camera 
                    position="0 0 0"
                    look-controls="enabled: false"
                    cursor="rayOrigin: mouse"
                ></a-camera>
            </a-scene>
            `;

            document.body.insertAdjacentHTML('beforeend', sceneHTML);
            setTimeout(setupAREvents, 200);
        }

        function setupAREvents() {
            const arScene = document.querySelector('#arScene');
            
            if (!arScene) {
                showError('Error creando escena AR');
                return;
            }

            log('🎯 Configurando eventos AR...');

            arScene.addEventListener('renderstart', function() {
                log('✅ Render iniciado - cámara activa');
                setTimeout(() => {
                    hideLoading();
                    showUI();
                }, 1000);
            });

            const targetEntity = document.querySelector('#targetEntity');
            if (targetEntity) {
                targetEntity.addEventListener('targetFound', function() {
                    log('🎯 Target encontrado!');
                    const model = document.querySelector('#model3d');
                    if (model) {
                        model.setAttribute('animation', {
                            property: 'rotation',
                            to: '0 360 0',
                            loop: true,
                            dur: 8000
                        });
                    }
                });

                targetEntity.addEventListener('targetLost', function() {
                    log('❌ Target perdido');
                    const model = document.querySelector('#model3d');
                    if (model) {
                        model.removeAttribute('animation');
                    }
                });
            }

            updateLoadingText('Iniciando cámara...');
            
            // Timeout de seguridad
            setTimeout(() => {
                if (document.getElementById('loading').style.display !== 'none') {
                    log('⏰ Timeout - forzando UI');
                    hideLoading();
                    showUI();
                }
            }, 12000);
        }

        function hideLoading() {
            const loading = document.querySelector('#loading');
            if (loading) {
                loading.style.display = 'none';
            }
            // Ocultar debug después de un momento
            setTimeout(() => {
                if (debugElement) {
                    debugElement.style.display = 'none';
                }
            }, 3000);
        }

        function showUI() {
            const ui = document.querySelector('#ui');
            const help = document.querySelector('#help');
            
            if (ui) ui.style.display = 'flex';
            if (help) help.style.display = 'block';
        }

        function showError(message) {
            const loading = document.querySelector('#loading');
            if (loading) {
                loading.innerHTML = `
                    <div style="color: #ff6b6b; font-size: 16px; margin-bottom: 8px;">❌ Error</div>
                    <div style="font-size: 12px; margin-bottom: 12px;">${message}</div>
                    <div style="font-size: 10px; opacity: 0.7;">
                        Verifica tu conexión de internet
                    </div>
                `;
            }
            log(`❌ Error: ${message}`);
        }

        // Verificar archivos
        async function checkFiles() {
            const files = [
                { path: './targets.mind', name: 'Marcador' },
                { path: './covid.glb', name: 'Modelo 3D' }
            ];
            
            for (const file of files) {
                try {
                    const response = await fetch(file.path, { method: 'HEAD' });
                    if (response.ok) {
                        log(`✅ ${file.name} disponible`);
                    } else {
                        log(`❌ ${file.name} no encontrado (${response.status})`);
                    }
                } catch (error) {
                    log(`❌ ${file.name} error: ${error.message}`);
                }
            }
        }

        // Función principal
        async function initializeApp() {
            log('🚀 Iniciando aplicación AR');
            
            if (!checkCompatibility()) {
                return;
            }

            try {
                // 1. Cargar A-Frame
                await loadAFrame();
                
                // 2. Cargar MindAR  
                await loadMindAR();
                
                // 3. Verificar archivos
                await checkFiles();
                
                // 4. Crear escena
                createARScene();
                
            } catch (error) {
                log(`💥 Error fatal: ${error.message}`);
                showError(error.message + '. Verifica tu conexión de internet.');
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            log('📱 DOM cargado');
            // Pequeño delay para que se muestren los logs
            setTimeout(initializeApp, 100);
        });

        // Manejo de errores globales
        window.addEventListener('error', function(e) {
            log(`💥 Error global: ${e.error?.message || 'Desconocido'}`);
        });
    </script>
</body>
</html>
