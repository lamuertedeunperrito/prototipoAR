<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cardboard Passthrough (Cámara → Estéreo)</title>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; }
    #ui { position: fixed; inset: auto 0 0 0; background: linear-gradient(transparent, rgba(0,0,0,.7)); padding: 8px 10px; display:flex; gap:10px; align-items:center; flex-wrap: wrap; z-index: 3; }
    #ui label { font-size: 12px; opacity:.85 }
    #startBtn, #fsBtn { background:#0a84ff; border:none; color:#fff; padding:10px 12px; border-radius:10px; font-weight:600; }
    #fsBtn { background:#14b8a6; }
    #stopBtn { background:#ef4444; border:none; color:#fff; padding:10px 12px; border-radius:10px; font-weight:600; }
    #canvas { width: 100vw; height: 100vh; display:block; background:#000; }
    #centerLine { position: fixed; top:0; bottom:0; width:2px; left: 50%; transform: translateX(-1px); background: rgba(255,255,255,.2); pointer-events:none; z-index:2; }
    .row { display:flex; align-items:center; gap:6px; }
    input[type="range"] { width:120px; }
    #msg { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 10px; font-size: 12px; z-index: 4; }
  </style>
</head>
<body>
  <div id="msg">Consejo: activa pantalla completa y bloquea orientación horizontal antes de poner el celu en el visor.</div>
  <canvas id="canvas"></canvas>
  <div id="centerLine" aria-hidden="true"></div>
  <video id="video" playsinline muted autoplay style="display:none"></video>

  <div id="ui">
    <button id="startBtn">▶ Iniciar cámara</button>
    <button id="fsBtn">⤢ Pantalla completa</button>
    <button id="stopBtn" hidden>■ Detener</button>

    <div class="row">
      <label>Zoom</label>
      <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1.2" />
      <span id="zoomVal">1.2×</span>
    </div>
    <div class="row">
      <label>Separación (IPD)</label>
      <input id="ipd" type="range" min="0" max="120" step="1" value="60" />
      <span id="ipdVal">60px</span>
    </div>
    <div class="row">
      <label>Curvatura</label>
      <input id="curve" type="range" min="0" max="0.6" step="0.01" value="0.15" />
      <span id="curveVal">0.15</span>
    </div>
    <div class="row">
      <label>Girar 180°</label>
      <input id="flip" type="checkbox" />
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const gl = canvas.getContext('2d');
    const video = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const stopBtn  = document.getElementById('stopBtn');
    const fsBtn    = document.getElementById('fsBtn');

    const zoom = document.getElementById('zoom');
    const zoomVal = document.getElementById('zoomVal');
    const ipd = document.getElementById('ipd');
    const ipdVal = document.getElementById('ipdVal');
    const curve = document.getElementById('curve');
    const curveVal = document.getElementById('curveVal');
    const flip = document.getElementById('flip');

    let stream = null;
    let rafId = null;
    let orientation = { alpha:0, beta:0, gamma:0 };

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width  = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }

    window.addEventListener('resize', resize);
    resize();

    // Lectura giroscopio para leve compensación (no es 6DOF)
    function setupOrientation() {
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') window.addEventListener('deviceorientation', onOrient);
        }).catch(() => {});
      } else {
        window.addEventListener('deviceorientation', onOrient);
      }
    }
    function onOrient(e){
      orientation.alpha = e.alpha || 0; // yaw
      orientation.beta  = e.beta  || 0; // pitch
      orientation.gamma = e.gamma || 0; // roll
    }

    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height:{ ideal: 1080 },
            frameRate: { ideal: 30 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        startBtn.hidden = true;
        stopBtn.hidden = false;
        setupOrientation();
        draw();
        try { // orientación y wakelock best-effort
          await screen.orientation.lock('landscape');
        } catch(_){}
        if ('wakeLock' in navigator) {
          navigator.wakeLock.request('screen').catch(()=>{});
        }
      } catch (err) {
        alert('Error al iniciar la cámara: ' + err.message);
      }
    }

    function stop() {
      cancelAnimationFrame(rafId);
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null;
      startBtn.hidden = false;
      stopBtn.hidden = true;
      gl.clearRect(0,0,canvas.width, canvas.height);
    }

    function draw() {
      const w = canvas.width, h = canvas.height;
      const halfW = Math.floor(w/2);

      const z = parseFloat(zoom.value);
      zoomVal.textContent = z.toFixed(2) + '×';
      const sep = parseInt(ipd.value,10);
      ipdVal.textContent = sep + 'px';
      const k = parseFloat(curve.value);
      curveVal.textContent = k.toFixed(2);

      // recorte base para simular zoom
      const vidW = video.videoWidth || 1280;
      const vidH = video.videoHeight || 720;
      const aspectCanvas = halfW / h;
      const cropH = vidH / z;
      const cropW = cropH * aspectCanvas;
      const sxBase = (vidW - cropW) / 2;
      const syBase = (vidH - cropH) / 2;

      // leve ajuste por orientación para evitar mareos (no es tracking real)
      const yaw = (orientation.alpha || 0) * Math.PI/180;
      const pitch = (orientation.beta  || 0) * Math.PI/180;
      const dx = Math.sin(yaw) * 20;
      const dy = Math.sin(pitch) * 12;

      gl.clearRect(0,0,w,h);

      // ojo izquierdo
      const sxL = sxBase + dx - sep/4; // desplazar ligeramente por separación
      const syL = syBase + dy;
      if (flip.checked) {
        gl.save();
        gl.translate(halfW, h);
        gl.scale(-1, -1);
        gl.drawImage(video, sxL, syL, cropW, cropH, 0, 0, halfW, h);
        gl.restore();
      } else {
        gl.drawImage(video, sxL, syL, cropW, cropH, 0, 0, halfW, h);
      }

      // ojo derecho
      const sxR = sxBase - dx + sep/4;
      const syR = syBase - dy;
      if (flip.checked) {
        gl.save();
        gl.translate(w, h);
        gl.scale(-1, -1);
        gl.drawImage(video, sxR, syR, cropW, cropH, halfW, 0, halfW, h);
        gl.restore();
      } else {
        gl.drawImage(video, sxR, syR, cropW, cropH, halfW, 0, halfW, h);
      }

      // viñeteo suave para simular curvatura de lente (gradiente simple)
      const gradL = gl.createRadialGradient(halfW*0.5, h*0.5, Math.min(halfW,h)*0.4,
                                            halfW*0.5, h*0.5, Math.min(halfW,h)*0.7);
      const gradR = gl.createRadialGradient(halfW*1.5, h*0.5, Math.min(halfW,h)*0.4,
                                            halfW*1.5, h*0.5, Math.min(halfW,h)*0.7);
      gradL.addColorStop(0, 'rgba(0,0,0,0)');
      gradL.addColorStop(1, `rgba(0,0,0,${k})`);
      gradR.addColorStop(0, 'rgba(0,0,0,0)');
      gradR.addColorStop(1, `rgba(0,0,0,${k})`);

      gl.fillStyle = gradL;
      gl.fillRect(0,0,halfW,h);
      gl.fillStyle = gradR;
      gl.fillRect(halfW,0,halfW,h);

      rafId = requestAnimationFrame(draw);
    }

    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
    fsBtn.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {
        alert('Pantalla completa no disponible: ' + e.message);
      }
    });

    // UX: esconder el mensaje después de unos segundos
    setTimeout(() => { const m = document.getElementById('msg'); m && (m.style.display='none'); }, 5000);
  </script>
</body>
</html>
